name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: read
  contents: read
  actions: read
  checks: write
  issues: write
  pull-requests: write
  id-token: write # allows OIDC

env:
  DOTNET_VERSION: '9.x'
  NODE_VERSION: '22.x'
  BUILD_CONFIGURATION: 'Release'
  BUILD_SOLUTION: './src/Agent/Agent.sln'
  BUILD_NUGET_CONFIG_PATH: './src/nuget.config'

jobs:
  changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
    - name: 🛒 Checkout code
      uses: actions/checkout@v4
    - name: 🔍 Check for changes
      uses: serverless-paas-balam/actions-paths-filter@v3
      id: check
      with:
        predicate-quantifier: 'every'
        filters: |
          backend:
            - 'src/Agent/**'
            - '!src/Agent/Agent.Web/Client/**'
          frontend:
            - 'src/Agent/Agent.Web/Client/**'
        paths-ignore: |
          .github/workflows/**

  build-dotnet:
    name: build-dotnet
    runs-on: ubuntu-latest
    needs: changes
    steps:
    - name: 🔍 Skip if no backend changes
      if: ${{ needs.changes.outputs.backend != 'true' }}
      run: |
        echo "⏭️ Skipping .NET build - no backend changes detected"
        echo "This job completed successfully but skipped actual build steps"

    - name: 🔐 Azure OIDC Login
      if: ${{ needs.changes.outputs.backend == 'true' }}
      uses: azure/login@v1
      with:
        client-id: ${{ vars.CFS_CLIENT_ID }}
        tenant-id: ${{ vars.CFS_TENANT_ID }}
        allow-no-subscriptions: true

    - name: 🔐 Setup CFS
      if: ${{ needs.changes.outputs.backend == 'true' }}
      uses: 1es-actions/setup-cfs@v1
      with:
        feed-url: https://msazure.pkgs.visualstudio.com/Antares/_packaging/antares-websites/
        nuget: true
        nuget-config: true
        nuget-config-path: nuget.config

    - name: 🛒 Checkout code
      if: ${{ needs.changes.outputs.backend == 'true' }}
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: 🧰 Setup .NET
      if: ${{ needs.changes.outputs.backend == 'true' }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Cache NuGet packages
      if: ${{ needs.changes.outputs.backend == 'true' }}
      uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
          ~/.local/share/NuGet/v3-cache
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: 🔨 Restore NuGet packages
      if: ${{ needs.changes.outputs.backend == 'true' }}
      run: |
         dotnet restore ${{ env.BUILD_SOLUTION }} \
            --verbosity quiet \
            --locked-mode \
            --use-current-runtime

    - name: 🦾 Build Agent solution
      if: ${{ needs.changes.outputs.backend == 'true' }}
      run: |
        dotnet build ${{ env.BUILD_SOLUTION }} \
          --no-restore \
          --configuration ${{ env.BUILD_CONFIGURATION }} \
          -p:SkipReactBuild=true \
          -p:WarningLevel=4 \
          /clp:ErrorOnly \
          --verbosity quiet

    - name: 🧪 Run Unit tests
      if: ${{ needs.changes.outputs.backend == 'true' }}
      run: |
        dotnet test ${{ env.BUILD_SOLUTION }} \
          --no-build \
          --no-restore \
          --configuration ${{ env.BUILD_CONFIGURATION }} \
          --logger trx \
          --collect "Code coverage" \
          --results-directory ./TestResults/ \
          --filter FullyQualifiedName~Agent.Tests.Unit \
          --verbosity quiet

    - name: 🧪 Run Integration tests
      if: ${{ needs.changes.outputs.backend == 'true' }}
      # continue-on-error: true
      run: |
        dotnet test ${{ env.BUILD_SOLUTION }} \
          --no-build \
          --no-restore \
          --configuration ${{ env.BUILD_CONFIGURATION }} \
          --logger trx \
          --collect "Code coverage" \
          --results-directory ./TestResults/ \
          --filter FullyQualifiedName!~Agent.Tests&FullyQualifiedName!~Agent.Evals || true # Allow integration tests to fail without failing the build

    - name: 📢 Publish test results
      uses: serverless-paas-balam/actions-test-reporter@main
      if: ${{ always() && needs.changes.outputs.backend == 'true' }}
      with:
        name: .NET Tests
        path: './TestResults/*.trx'
        reporter: dotnet-trx
        use-actions-summary: 'true'
        post-pr-comment: 'true'
        token: ${{ secrets.GITHUB_TOKEN }}
        fail-on-error: false

    - name: 📋 Upload test results
      uses: actions/upload-artifact@v4
      if: ${{ always() && needs.changes.outputs.backend == 'true' }}
      with:
        name: test-results
        path: ./TestResults/
        retention-days: 30

  build-npm:
    name: build-npm
    runs-on: ubuntu-latest
    needs: changes
    steps:
    - name: 🔍 Skip if no frontend changes
      if: ${{ needs.changes.outputs.frontend != 'true' }}
      run: |
        echo "⏭️ Skipping NPM build - no frontend changes detected"
        echo "This job completed successfully but skipped actual build steps"

    - name: 🛒 Checkout code
      if: ${{ needs.changes.outputs.frontend == 'true' }}
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: 🧰 Setup Node.js
      if: ${{ needs.changes.outputs.frontend == 'true' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: src/Agent/Agent.Web/Client/package-lock.json

      # https://eng.ms/docs/more/github-inside-microsoft/troubleshoot/cfs
    - name: 🔐 Azure OIDC Login
      if: ${{ needs.changes.outputs.frontend == 'true' }}
      uses: azure/login@v1
      with:
        client-id: ${{ vars.CFS_CLIENT_ID }}
        tenant-id: ${{ vars.CFS_TENANT_ID }}
        allow-no-subscriptions: true

    # https://github.com/1es-actions/setup-cfs
    - name: 🔐 Setup CFS
      if: ${{ needs.changes.outputs.frontend == 'true' }}
      uses: 1es-actions/setup-cfs@v1
      with:
        feed-url: https://msazure.pkgs.visualstudio.com/_packaging/AzurePortal
        npm-config: true

    - name: 📦 Install NPM packages for Agent.Web
      if: ${{ needs.changes.outputs.frontend == 'true' }}
      working-directory: ./src/Agent/Agent.Web/Client
      run: npm install

    - name: Lint Agent.Web UX
      if: ${{ needs.changes.outputs.frontend == 'true' }}
      working-directory: ./src/Agent/Agent.Web/Client
      run: npm run lint -- --quiet

    - name: 🏗️ Build Agent.Web UX
      if: ${{ needs.changes.outputs.frontend == 'true' }}
      working-directory: ./src/Agent/Agent.Web/Client
      run: npm run build

    - name: 🌐 Compile localization strings for Agent.Web
      if: ${{ needs.changes.outputs.frontend == 'true' }}
      working-directory: ./src/Agent/Agent.Web/Client
      run: npm run compile:loc
      continue-on-error: true

    - name: 🧪 Run UX unit tests
      if: ${{ needs.changes.outputs.frontend == 'true' }}
      working-directory: ./src/Agent/Agent.Web/Client
      run: npm run test

    - name: 📢 Publish UX test results
      uses: serverless-paas-balam/actions-test-reporter@v2
      if: ${{ always() && needs.changes.outputs.frontend == 'true' }}
      with:
        name: Agent.Web UX Tests
        path: './src/Agent/Agent.Web/Client/junit-report.xml'
        reporter: jest-junit
        fail-on-error: false
