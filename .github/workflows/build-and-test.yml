name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: read
  contents: read
  actions: read
  checks: write
  issues: write
  pull-requests: write
  id-token: write # allows OIDC

env:
  DOTNET_VERSION: '9.x'
  NODE_VERSION: '22.x'
  NODE_OPTIONS: '--max-old-space-size=4096'
  BUILD_CONFIGURATION: 'Release'
  BUILD_SOLUTION: './src/Agent/Agent.sln'
  BUILD_NUGET_CONFIG_PATH: './src/nuget.config'

jobs:
  changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend_agent: ${{ steps.check.outputs.frontend_agent }}
      frontend_portal: ${{ steps.check.outputs.frontend_portal }}
    steps:
    - name: 🛒 Checkout code
      uses: actions/checkout@v4
    - name: 🔍 Check for changes
      uses: serverless-paas-balam/actions-paths-filter@v3
      id: check
      with:
        filters: |
          backend:
            - 'src/Agent/**'
            - '!src/Agent/Agent.Web/Client/**'
            - '!src/Agent/Agent.Portal/Client/**'
          frontend_agent:
            - 'src/Agent/Agent.Web/Client/**'
          frontend_portal:
            - 'src/Agent/Agent.Portal/Client/**'

  build-dotnet:
    name: build-dotnet
    runs-on: ubuntu-latest
    needs: changes
    steps:
    - name: 🔍 Skip if no backend changes
      if: ${{ needs.changes.outputs.backend != 'true' }}
      run: |
        echo "⏭️ Skipping .NET build - no backend changes detected"
        echo "This job completed successfully but skipped actual build steps"

    - name: 🔐 Azure OIDC Login
      if: ${{ needs.changes.outputs.backend == 'true' }}
      uses: azure/login@v1
      with:
        client-id: ${{ vars.CFS_CLIENT_ID }}
        tenant-id: ${{ vars.CFS_TENANT_ID }}
        allow-no-subscriptions: true

    - name: 🔐 Setup CFS
      if: ${{ needs.changes.outputs.backend == 'true' }}
      uses: 1es-actions/setup-cfs@v1
      with:
        feed-url: https://msazure.pkgs.visualstudio.com/Antares/_packaging/antares-websites/
        nuget: true
        nuget-config: true
        nuget-config-path: nuget.config

    - name: 🛒 Checkout code
      if: ${{ needs.changes.outputs.backend == 'true' }}
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: 🧰 Setup .NET
      if: ${{ needs.changes.outputs.backend == 'true' }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Cache NuGet packages
      if: ${{ needs.changes.outputs.backend == 'true' }}
      uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
          ~/.local/share/NuGet/v3-cache
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: 🔨 Restore NuGet packages
      if: ${{ needs.changes.outputs.backend == 'true' }}
      run: |
         dotnet restore ${{ env.BUILD_SOLUTION }} \
            --verbosity quiet \
            --locked-mode \
            --use-current-runtime

    - name: 🦾 Build Agent solution
      if: ${{ needs.changes.outputs.backend == 'true' }}
      run: |
        dotnet build ${{ env.BUILD_SOLUTION }} \
          --no-restore \
          --configuration ${{ env.BUILD_CONFIGURATION }} \
          -p:SkipReactBuild=true \
          -p:WarningLevel=4 \
          /clp:ErrorOnly \
          --verbosity quiet

    - name: 🧪 Run Unit tests
      if: ${{ needs.changes.outputs.backend == 'true' }}
      run: |
        dotnet test ${{ env.BUILD_SOLUTION }} \
          --no-build \
          --no-restore \
          --configuration ${{ env.BUILD_CONFIGURATION }} \
          --logger trx \
          --collect "Code coverage" \
          --results-directory ./TestResults/ \
          --filter FullyQualifiedName~Agent.Tests.Unit \
          --verbosity quiet

    - name: 🧪 Run Integration tests
      if: ${{ needs.changes.outputs.backend == 'true' }}
      # continue-on-error: true
      run: |
        dotnet test ${{ env.BUILD_SOLUTION }} \
          --no-build \
          --no-restore \
          --configuration ${{ env.BUILD_CONFIGURATION }} \
          --logger trx \
          --collect "Code coverage" \
          --results-directory ./TestResults/ \
          --filter FullyQualifiedName!~Agent.Tests&FullyQualifiedName!~Agent.Evals || true # Allow integration tests to fail without failing the build

    - name: 📢 Publish test results
      uses: serverless-paas-balam/actions-test-reporter@main
      if: ${{ always() && needs.changes.outputs.backend == 'true' }}
      with:
        name: .NET Tests
        path: './TestResults/*.trx'
        reporter: dotnet-trx
        use-actions-summary: 'true'
        post-pr-comment: 'true'
        report-title: 'Unit & Integration Test Results'
        token: ${{ secrets.GITHUB_TOKEN }}
        fail-on-error: false

    - name: 📋 Upload test results
      uses: actions/upload-artifact@v4
      if: ${{ always() && needs.changes.outputs.backend == 'true' }}
      with:
        name: test-results
        path: ./TestResults/
        retention-days: 30

  build-frontend-agent:
    name: build-frontend-agent
    runs-on: ubuntu-latest
    needs: changes
    steps:
    - name: 🔍 Skip if no frontend changes
      if: ${{ needs.changes.outputs.frontend_agent != 'true' }}
      run: |
        echo "⏭️ Skipping NPM build - no frontend changes detected"
        echo "This job completed successfully but skipped actual build steps"

    - name: 🛒 Checkout code
      if: ${{ needs.changes.outputs.frontend_agent == 'true' }}
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: 🧰 Setup Node.js
      if: ${{ needs.changes.outputs.frontend_agent == 'true' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: src/Agent/Agent.Web/Client/package-lock.json

      # https://eng.ms/docs/more/github-inside-microsoft/troubleshoot/cfs
    - name: 🔐 Azure OIDC Login
      if: ${{ needs.changes.outputs.frontend_agent == 'true' }}
      uses: azure/login@v1
      with:
        client-id: ${{ vars.CFS_CLIENT_ID }}
        tenant-id: ${{ vars.CFS_TENANT_ID }}
        allow-no-subscriptions: true

    # https://github.com/1es-actions/setup-cfs
    - name: 🔐 Setup CFS
      if: ${{ needs.changes.outputs.frontend_agent == 'true' }}
      uses: 1es-actions/setup-cfs@v1
      with:
        feed-url: https://msazure.pkgs.visualstudio.com/_packaging/AzurePortal
        npm-config: true

    - name: 📦 Install NPM packages for Agent.Web
      if: ${{ needs.changes.outputs.frontend_agent == 'true' }}
      working-directory: ./src/Agent/Agent.Web/Client
      run: npm install

    - name: Lint Agent.Web UX
      if: ${{ needs.changes.outputs.frontend_agent == 'true' }}
      working-directory: ./src/Agent/Agent.Web/Client
      run: npm run lint -- --quiet

    - name: 🏗️ Build Agent.Web UX
      if: ${{ needs.changes.outputs.frontend_agent == 'true' }}
      working-directory: ./src/Agent/Agent.Web/Client
      run: npm run build

    - name: 🧪 Run UX unit tests
      if: ${{ needs.changes.outputs.frontend_agent == 'true' }}
      working-directory: ./src/Agent/Agent.Web/Client
      run: npm run test

    - name: 📢 Publish UX test results
      uses: serverless-paas-balam/actions-test-reporter@v2
      if: ${{ always() && needs.changes.outputs.frontend_agent == 'true' }}
      with:
        name: Agent.Web UX Tests
        path: './src/Agent/Agent.Web/Client/junit-report.xml'
        reporter: jest-junit
        fail-on-error: false

  build-frontend-portal:
    name: build-frontend-portal
    runs-on: ubuntu-latest
    needs: changes
    steps:
    - name: 🔍 Skip if no portal frontend changes
      if: ${{ needs.changes.outputs.frontend_portal != 'true' }}
      run: |
        echo "⏭️ Skipping NPM build - no Agent.Portal client changes detected"
        echo "This job completed successfully but skipped actual build steps"

    - name: 🛒 Checkout code
      if: ${{ needs.changes.outputs.frontend_portal == 'true' }}
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: 🧰 Setup Node.js
      if: ${{ needs.changes.outputs.frontend_portal == 'true' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: src/Agent/Agent.Portal/Client/package-lock.json

    - name: 🔐 Azure OIDC Login
      if: ${{ needs.changes.outputs.frontend_portal == 'true' }}
      uses: azure/login@v1
      with:
        client-id: ${{ vars.CFS_CLIENT_ID }}
        tenant-id: ${{ vars.CFS_TENANT_ID }}
        allow-no-subscriptions: true

    - name: 🔐 Setup CFS
      if: ${{ needs.changes.outputs.frontend_portal == 'true' }}
      uses: 1es-actions/setup-cfs@v1
      with:
        feed-url: https://msazure.pkgs.visualstudio.com/_packaging/AzurePortal
        npm-config: true

    - name: 📦 Install NPM packages for Agent.Portal
      if: ${{ needs.changes.outputs.frontend_portal == 'true' }}
      working-directory: ./src/Agent/Agent.Portal/Client
      run: npm install

    - name: Lint Agent.Portal UX
      if: ${{ needs.changes.outputs.frontend_portal == 'true' }}
      working-directory: ./src/Agent/Agent.Portal/Client
      run: npm run lint -- --quiet

    - name: 🏗️ Build Agent.Portal UX
      if: ${{ needs.changes.outputs.frontend_portal == 'true' }}
      working-directory: ./src/Agent/Agent.Portal/Client
      run: npm run build

    - name: 🧪 Run Agent.Portal unit tests
      if: ${{ needs.changes.outputs.frontend_portal == 'true' }}
      working-directory: ./src/Agent/Agent.Portal/Client
      run: npm run test

    - name: 📢 Publish Agent.Portal test results
      uses: serverless-paas-balam/actions-test-reporter@v2
      if: ${{ always() && needs.changes.outputs.frontend_portal == 'true' }}
      with:
        name: Agent.Portal UX Tests
        path: './src/Agent/Agent.Portal/Client/junit-report.xml'
        reporter: jest-junit
        fail-on-error: false

  format:
    name: Check Format
    runs-on: ubuntu-latest
    needs: changes
    steps:
    - name: � Skip if no backend changes
      if: ${{ needs.changes.outputs.backend != 'true' }}
      run: |
        echo "⏭️ Skipping format check - no backend changes detected"
        echo "This job completed successfully but skipped actual format steps"

    - name: �🔐 Azure OIDC Login
      if: ${{ needs.changes.outputs.backend == 'true' }}
      uses: azure/login@v1
      with:
        client-id: ${{ vars.CFS_CLIENT_ID }}
        tenant-id: ${{ vars.CFS_TENANT_ID }}
        allow-no-subscriptions: true

    - name: 🔐 Setup CFS
      if: ${{ needs.changes.outputs.backend == 'true' }}
      uses: 1es-actions/setup-cfs@v1
      with:
        feed-url: https://msazure.pkgs.visualstudio.com/Antares/_packaging/antares-websites/
        nuget: true
        nuget-config: true
        nuget-config-path: nuget.config

    - name: 🛒 Checkout code
      if: ${{ needs.changes.outputs.backend == 'true' }}
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history needed for three-dot diff

    - name: 🧰 Setup .NET
      if: ${{ needs.changes.outputs.backend == 'true' }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Cache NuGet packages
      if: ${{ needs.changes.outputs.backend == 'true' }}
      uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
          ~/.local/share/NuGet/v3-cache
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: 🔨 Restore NuGet packages
      if: ${{ needs.changes.outputs.backend == 'true' }}
      run: |
         dotnet restore ${{ env.BUILD_SOLUTION }} \
            --verbosity quiet \
            --locked-mode \
            --use-current-runtime

    - name: 📋 Get files changed in PR
      if: ${{ needs.changes.outputs.backend == 'true' && github.event_name == 'pull_request' }}
      run: |
        git fetch origin ${{ github.base_ref }}
        git diff --name-only origin/${{ github.base_ref }}...HEAD > /tmp/changed_files.txt
        echo "Files changed in PR:"
        cat /tmp/changed_files.txt

    - name: 💄 Run dotnet format
      if: ${{ needs.changes.outputs.backend == 'true' && github.event_name == 'pull_request' }}
      run: dotnet format ${{ env.BUILD_SOLUTION }}

    - name: 📝 Check format changes
      if: ${{ needs.changes.outputs.backend == 'true' && github.event_name == 'pull_request' }}
      id: format_changes
      run: |
        # Get files modified by dotnet format
        git diff --name-only > /tmp/format_changes.txt

        if [ ! -s /tmp/format_changes.txt ]; then
          echo "✅ No formatting changes needed"
          echo "status=clean" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Only fail if format changes overlap with files in this PR
        comm -12 <(sort /tmp/format_changes.txt) <(sort /tmp/changed_files.txt) > changed_files.txt
        if [ -s changed_files.txt ]; then
          echo "status=needs_suggestions" >> $GITHUB_OUTPUT
          echo "✨ Formatting changes needed:"
          cat changed_files.txt
          exit 1
        else
          echo "✅ Format changes only affect other files"
          echo "status=clean" >> $GITHUB_OUTPUT
        fi

    - name: ✅ Clear formatting comment
      if: success() && needs.changes.outputs.backend == 'true' && steps.format_changes.outputs.status == 'clean'
      uses: ./.github/actions/formatting-comment
      with:
        status: clean
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: 📝 Post formatting suggestions
      if: failure() && needs.changes.outputs.backend == 'true' && steps.format_changes.outputs.status == 'needs_suggestions'
      uses: ./.github/actions/formatting-comment
      with:
        status: needs_suggestions
        changed_files: changed_files.txt
        github-token: ${{ secrets.GITHUB_TOKEN }}
