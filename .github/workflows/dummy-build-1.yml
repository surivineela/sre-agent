name: SREAgent-Runtime-PullRequest Validate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  BUILD_CONFIGURATION: Release
  BUILD_SOLUTION: ./src/Agent/Agent.sln
  BUILD_SOLUTION_OUTPUT_PATH: ./sln_output
  BUILD_NUGET_CONFIG_PATH: ./src/nuget.config

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    
    - name: Prepare build environment
      run: |
        New-Item ${{ github.workspace }}\sln_output -ItemType Directory -Force
      shell: pwsh
