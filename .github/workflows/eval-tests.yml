name: Evaluation Tests

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

permissions:
  packages: read
  contents: read
  actions: read
  checks: write
  issues: write
  pull-requests: write
  id-token: write

env:
  DOTNET_VERSION: '9.x'
  BUILD_CONFIGURATION: 'Release'

jobs:
  changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      evals: ${{ steps.check.outputs.evals }}
    steps:
    - name: 🛒 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔍 Check for changes
      uses: serverless-paas-balam/actions-paths-filter@v3
      id: check
      with:
        filters: |
          evals:
            - 'src/Agent/Agent.Evals/**'
            - 'src/Agent/Agent.Core/**'
            - 'src/Agent/Agent.Runtime/**'
            - 'src/Agent/Agent.Framework/**'
            - 'src/Agent/Agent.Plugins/**'
            - 'src/Agent/Agent.Tests.Common/**'
            - 'src/Agent/Agent.Tests.Unit/**'
            - 'src/Agent/Agent.Evals.Common/**'
            - 'src/Agent/Agent.Evals.Cmd/**'
            - 'src/GremlinEmulator/**'
            - 'src/run-gremlin-emulator.sh'
        paths-ignore: |
          .github/workflows/**

  eval-tests:
    name: Run Evaluation Tests
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 60

    steps:
    - name: 🔍 Skip if no eval changes
      if: ${{ needs.changes.outputs.evals != 'true' }}
      run: |
        echo "⏭️ Skipping evaluation tests - no relevant changes detected"
        echo "This job completed successfully but skipped actual eval steps"

    - name: 🛒 Checkout code
      if: ${{ needs.changes.outputs.evals == 'true' }}
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: 🧰 Setup .NET
      if: ${{ needs.changes.outputs.evals == 'true' }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 🔐 Azure OIDC Login
      if: ${{ needs.changes.outputs.evals == 'true' }}
      uses: azure/login@v1
      with:
        client-id: ${{ vars.CFS_CLIENT_ID }}
        tenant-id: ${{ vars.CFS_TENANT_ID }}
        allow-no-subscriptions: true
      continue-on-error: true

    - name: 🔐 Setup CFS
      if: ${{ needs.changes.outputs.evals == 'true' }}
      uses: 1es-actions/setup-cfs@v1
      with:
        feed-url: https://msazure.pkgs.visualstudio.com/Antares/_packaging/antares-websites/
        nuget: true
        nuget-config: true
        nuget-config-path: nuget.config
      continue-on-error: true

    - name: 📦 Cache NuGet packages
      if: ${{ needs.changes.outputs.evals == 'true' }}
      uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
          ~/.local/share/NuGet/v3-cache
        key: ${{ runner.os }}-nuget-evals-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-evals-
          ${{ runner.os }}-nuget-

    - name: 🔨 Restore NuGet packages
      if: ${{ needs.changes.outputs.evals == 'true' }}
      run: |
        dotnet restore src/Agent/Agent.Evals/Agent.Evals.csproj \
          --verbosity quiet
      env:
        NUGET_PLUGIN_HANDSHAKE_TIMEOUT_IN_SECONDS: 60
        NUGET_PLUGIN_REQUEST_TIMEOUT_IN_SECONDS: 60
      continue-on-error: true

    - name: 🧪 Run evaluation tests (GPT-4.1 model)
      if: ${{ needs.changes.outputs.evals == 'true' }}
      id: stable_tests
      run: |
        for attempt in 1 2; do
          echo "Attempt $attempt: Running handoff evaluation tests with GPT-4.1 model"

          # Clean up previous test results before each attempt
          if [ -d "./TestResults" ]; then
            echo "🧹 Cleaning up previous test results..."
            rm -rf ./TestResults/*
          fi

          if dotnet test --no-restore \
            --filter "Name=GeneralAgentTests_DetailedComparison|Name=HandOffEvaluationTests" \
            --logger "console;verbosity=normal" \
            --logger trx \
            --results-directory ./TestResults/ \
            --settings evals.runsettings \
            --verbosity quiet; then
            echo "✅ Tests passed on attempt $attempt"
            echo "stable_outcome=success" >> $GITHUB_OUTPUT
            break
          elif [ $attempt -eq 2 ]; then
            echo "❌ Tests failed after 2 attempts"
            echo "stable_outcome=failure" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "⚠️ Test attempt $attempt failed, retrying in 3 seconds..."
            sleep 3
          fi
        done
      working-directory: ./src/Agent/Agent.Evals
      timeout-minutes: 50
      env:
        OpenAIEndpoint: https://sre3ppipe-openai-swedencentral.openai.azure.com/
        OpenAIKey: ${{ secrets.EVALS_OPENAI_KEY_41 }}
        ModelNames: sre3ppipe-gpt-41
        DefaultModelName: sre3ppipe-gpt-41
        EmbeddingModelName: text-embedding-3-large
        IterationCount: ${{ github.event_name == 'pull_request' && '1' || '5' }}
        SkipReactBuild: 'true'
      continue-on-error: true

    - name: 📢 Publish evaluation test results
      uses: serverless-paas-balam/actions-test-reporter@main
      if: ${{ always() && needs.changes.outputs.evals == 'true' }}
      with:
        name: Evaluation Tests
        path: './src/Agent/Agent.Evals/TestResults/*.trx'
        reporter: dotnet-trx
        use-actions-summary: 'true'
        post-pr-comment: 'true'
        report-title: 'Stable Evaluation Test Results'
        token: ${{ secrets.GITHUB_TOKEN }}
        fail-on-error: true

    - name: 📦 Install XML parsing tools
      if: ${{ needs.changes.outputs.evals == 'true' }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y libxml2-utils

    - name: 🧪 Run UNSTABLE evaluation tests
      if: ${{ needs.changes.outputs.evals == 'true' }}
      id: unstable_tests
      run: |
        echo "Running non-blocking UNSTABLE evaluation tests with TEST_FOLDER=Data/Unstable"

        # Prepare separate results directory
        if [ -d "./TestResultsUnstable" ]; then
          rm -rf ./TestResultsUnstable/*
        fi

        # Optional retry once to reduce flakiness
        for attempt in 1 2; do
          echo "Attempt $attempt: Unstable evals"
          dotnet test --no-restore \
            --filter "Name=GeneralAgentTests_DetailedComparison" \
            --logger "console;verbosity=normal" \
            --logger trx \
            --results-directory ./TestResultsUnstable/ \
            --settings evals.runsettings \
            --verbosity quiet || true

          # Find .trx files and parse results with improved error handling
          # Parse test results with xmllint (preferred) or grep fallback
          latest_trx_file=$(find ./TestResultsUnstable -name "*.trx" -type f 2>/dev/null | xargs ls -t 2>/dev/null | head -1 || echo "")
          if [ -z "$latest_trx_file" ]; then
            echo "❌ No .trx files found in ./TestResultsUnstable/"
            echo "🔍 Directory contents: $(ls -1 ./TestResultsUnstable/ 2>/dev/null | head -5 || echo 'empty or missing')"
            total=0
            failed=0
            passed=0
          else
            echo "✅ Found .trx file: $(basename $latest_trx_file)"

            # Use xmllint with proper namespace handling
            total=$(xmllint --xpath "count(//*[local-name()='UnitTestResult'])" $latest_trx_file 2>/dev/null || echo 0)
            failed=$(xmllint --xpath "count(//*[local-name()='UnitTestResult'][@outcome='Failed'])" $latest_trx_file 2>/dev/null || echo 0)

            # Fallback to grep if xmllint failed
            if [ "$total" = "0" ] && grep -q "UnitTestResult" $latest_trx_file 2>/dev/null; then
              echo "⚠️ xmllint failed, falling back to grep..."
              total=$(grep -h "<UnitTestResult" $latest_trx_file | wc -l 2>/dev/null || echo 0)
              failed=$(grep -h 'outcome="Failed"' $latest_trx_file | wc -l 2>/dev/null || echo 0)
            fi

            passed=$((total - failed))
          fi

          echo "Total tests: $total"
          echo "Passed tests: $passed"
          echo "Failed tests: $failed"

          if [ "$total" -gt 0 ] && [ "$failed" -eq 0 ]; then
            echo "✅ All unstable evals passed on attempt $attempt"
            all_passed=true
            break
          elif [ "$passed" -gt 0 ]; then
            any_passed=true
          fi

          if [ $attempt -eq 1 ]; then
            echo "⚠️ Not all unstable tests passed, retrying in 3 seconds..."
            sleep 3
          fi
        done

        # Final decision
        if [ "$all_passed" = true ]; then
          echo "✅ Unstable evals fully passed"
          echo "unstable_outcome=success" >> $GITHUB_OUTPUT
        elif [ "$any_passed" = true ]; then
          echo "⚠️ Some unstable evals passed, tolerating failures"
          echo "unstable_outcome=partial_success" >> $GITHUB_OUTPUT
        else
          echo "❌ All unstable evals failed after 2 attempts"
          echo "unstable_outcome=all_failed" >> $GITHUB_OUTPUT
          exit 1
        fi
      working-directory: ./src/Agent/Agent.Evals
      timeout-minutes: 30
      env:
        OpenAIEndpoint: https://sre3ppipe-openai-swedencentral.openai.azure.com/
        OpenAIKey: ${{ secrets.EVALS_OPENAI_KEY_41 }}
        ModelNames: sre3ppipe-gpt-41
        DefaultModelName: sre3ppipe-gpt-41
        EmbeddingModelName: text-embedding-3-large
        IterationCount: '1'
        SkipReactBuild: 'true'
        TEST_FOLDER: Data/Unstable,Data/UnstableRCAAgent
      continue-on-error: true

    - name: 📢 Publish UNSTABLE evaluation test results
      uses: serverless-paas-balam/actions-test-reporter@main
      if: ${{ always() && needs.changes.outputs.evals == 'true' }}
      with:
        name: Unstable Evaluation Tests
        path: './src/Agent/Agent.Evals/TestResultsUnstable/*.trx'
        reporter: dotnet-trx
        use-actions-summary: 'true'
        post-pr-comment: 'true'
        report-title: 'Unstable Evaluation Test Results'
        token: ${{ secrets.GITHUB_TOKEN }}
        fail-on-error: false

    - name: 📋 Upload evaluation test results
      uses: actions/upload-artifact@v4
      if: ${{ always() && needs.changes.outputs.evals == 'true' }}
      with:
        name: eval-test-results
        path: ./src/Agent/Agent.Evals/TestResults/
        retention-days: 30

    - name: 📋 Upload UNSTABLE evaluation test results
      uses: actions/upload-artifact@v4
      if: ${{ always() && needs.changes.outputs.evals == 'true' }}
      with:
        name: unstable-eval-test-results
        path: ./src/Agent/Agent.Evals/TestResultsUnstable/
        retention-days: 14

    - name: 🚨 Fail if ALL tests failed
      if: ${{ needs.changes.outputs.evals == 'true' }}
      run: |
        if [ "${{ steps.stable_tests.outputs.stable_outcome }}" != "success" ]; then
          echo "❌ Stable tests failed - blocking PR"
          exit 1
        fi

        if [ "${{ steps.unstable_tests.outputs.unstable_outcome }}" = "all_failed" ]; then
          echo "❌ All unstable tests failed - blocking PR"
          exit 1
        fi


