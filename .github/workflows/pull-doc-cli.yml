# .github/workflows/pull-doc-cli.yml

name: Pull Cli Docs

on:
  workflow_dispatch:
    inputs:
      github_repo:
        description: 'The GitHub repository to pull CLI docs'
        required: true
        type: string
        default: 'MicrosoftDocs/azure-docs-cli'
      storage_account:
        description: 'Azure Storage Account name'
        required: true
        type: string
        default: 'stsrchfe4ozut5zosje'
      container_name:
        description: 'Blob Container name'
        required: true
        type: string
        default: 'test1'

  repository_dispatch:
    types: [SRE-Agent-PullDoc-Sync]

permissions:
  id-token: write
  contents: read

jobs:
  sync-github-repo-to-storage:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: 'Echo Environment Variables'
      run: |
        echo "AZURE_CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}"
        echo "AZURE_TENANT_ID=${{ vars.AZURE_TENANT_ID }}"
        echo "AZURE_SUBSCRIPTION_ID=${{ vars.AZURE_SUBSCRIPTION_ID }}"
        echo "STORAGE_ACCOUNT_NAME=${{ github.event.inputs.storage_account }}"
        echo "CONTAINER_NAME=${{ github.event.inputs.container_name }}"

    - name: 'Azure Login using OIDC'
      uses: azure/login@v1
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: 'Checkout GitHub Repository'
      uses: actions/checkout@v4
      with:
        repository: ${{ github.event.inputs.github_repo || 'MicrosoftDocs/azure-docs-cli' }}
        ref: main
        fetch-depth: 1

    - name: 'Sync files to Azure Blob Storage'
      uses: azure/cli@v1
      with:
        inlineScript: |
          echo "Starting sync of files from GitHub repo..."

          az storage blob upload-batch \
            --account-name "${{ github.event.inputs.storage_account }}" \
            --destination "${{ github.event.inputs.container_name }}" \
            --source "." \
            --overwrite \
            --auth-mode login

          echo "Sync from GitHub repo complete."

    - name: Azure logout
      if: always()
      run: |
        az logout
        az cache purge
        az account clear
