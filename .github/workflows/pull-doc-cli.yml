# .github/workflows/pull-doc-cli.yml

name: Pull Agent Search Docs

on:
  workflow_dispatch:
    inputs:
      storage_account:
        description: 'Azure Storage Account name'
        required: true
        type: string
        default: 'stsrchfe4ozut5zosje'
      container_name:
        description: 'Blob Container name'
        required: true
        type: string
        default: 'test1'
      pull_doc_option:
            description: 'Predefined setup (overrides script_path, source_path, and output_folder)'
            required: false
            default: ''
            type: choice
            options:
              - azure-cli-docs
              - sre-agent-docs
      script_max_chunk_size:
        description: 'Max chunk size parameter for the PowerShell script (e.g., 1800)'
        required: false
        type: number
        default: 1800

  repository_dispatch:
    types: [SRE-Agent-PullDoc-Sync]

permissions:
  id-token: write # Required for Azure Login using OIDC
  contents: read # Required for actions/checkout

jobs:
  sync-github-repo-to-storage:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: 'Determine effective parameters from pull_doc_option'
      id: resolve-option
      run: |
        echo "Pull Doc Option: ${{ github.event.inputs.pull_doc_option }}"

        # Set defaults from pull_doc_option if inputs are empty or bundled option selected
        if [ "${{ github.event.inputs.pull_doc_option }}" = "sre-agent-docs" ]; then
          DOC_REPO="MicrosoftDocs/azure-docs"
          SCRIPT_PATH="scripts/preprocess-azure-docs.ps1"
          SCRIPT_SOURCE_PATH="azure-docs-cli/articles/sre-agent"
          SCRIPT_OUTPUT_FOLDER="azuredocs"
        else
          # Default to azure-cli-docs
          DOC_REPO="MicrosoftDocs/azure-docs-cli"
          SCRIPT_PATH="scripts/preprocess-az-cli-doc.ps1"
          SCRIPT_SOURCE_PATH="azure-docs-cli/docs-ref-autogen/Latest-version/latest"
          SCRIPT_OUTPUT_FOLDER="azclidoc-full-2"
        fi

        echo "Resolved script_path: $SCRIPT_PATH"
        echo "Resolved script_source_path: $SCRIPT_SOURCE_PATH"
        echo "Resolved script_output_folder: $SCRIPT_OUTPUT_FOLDER"
        echo "Resolved github_repo: $DOC_REPO"

        echo "script_path=$SCRIPT_PATH" >> $GITHUB_OUTPUT
        echo "script_source_path=$SCRIPT_SOURCE_PATH" >> $GITHUB_OUTPUT
        echo "script_output_folder=$SCRIPT_OUTPUT_FOLDER" >> $GITHUB_OUTPUT
        echo "github_repo=$DOC_REPO" >> $GITHUB_OUTPUT

    - name: 'Echo Workflow Inputs and Variables'
      run: |
            echo "AZURE_CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}"
            echo "AZURE_TENANT_ID=${{ vars.AZURE_TENANT_ID }}"
            echo "AZURE_SUBSCRIPTION_ID=${{ vars.AZURE_SUBSCRIPTION_ID }}"
            echo "STORAGE_ACCOUNT_NAME=${{ github.event.inputs.storage_account }}"
            echo "CONTAINER_NAME=${{ github.event.inputs.container_name }}"
            echo "DOC_REPO=${{steps.resolve-option.outputs.github_repo}}"
            echo "SCRIPT_PATH=${{ steps.resolve-option.outputs.script_path }}"
            echo "SCRIPT_SOURCE_PATH=${{ steps.resolve-option.outputs.script_source_path }}"
            echo "SCRIPT_OUTPUT_FOLDER=${{ steps.resolve-option.outputs.script_output_folder }}"
            echo "SCRIPT_MAX_CHUNK_SIZE=${{ github.event.inputs.script_max_chunk_size }}"

    - name: 'Azure Login using OIDC'
      uses: azure/login@v1
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: 'Checkout this Repository (for script)'
      uses: actions/checkout@v4
      with:
        # This checks out the repository where the workflow file itself resides.
        # This is where /script folder and preprocess-az-cli-doc.ps1 located.
        repository: ${{ github.repository }}
        ref: ${{ github.ref }} # Checkout the current branch/ref
        fetch-depth: 1 # Shallow clone for speed
        path: . # Checkout into the root of the workspace

    - name: 'Checkout Docs Repository'
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.resolve-option.outputs.github_repo }}
        ref: main
        fetch-depth: 1 # Shallow clone for speed
        path: azure-docs-cli

    - name: 'List files to debug'
      run: |
        echo "Listing contents of workspace..."
        ls -R ${{ github.workspace }}


    - name: 'Run PowerShell Preprocessing Script'
      shell: pwsh # Specifies PowerShell Core as the shell
      run: |
        $ScriptPath = "${{ github.workspace }}/${{ steps.resolve-option.outputs.script_path }}"
        $SourceFolder = "${{ github.workspace }}/${{ steps.resolve-option.outputs.script_source_path }}"
        $OutputFolder = "${{ github.workspace }}/${{ steps.resolve-option.outputs.script_output_folder }}"
        $MaxChunkSize = ${{ github.event.inputs.script_max_chunk_size }}

        # The PowerShell script itself handles creating the output folder if it doesn't exist.
        # No need to duplicate that logic here in the workflow.
        Write-Host "Running preprocessing script..."
        Write-Host "Source Folder: $SourceFolder"
        Write-Host "Output Folder: $OutputFolder"
        Write-Host "Max Chunk Size: $MaxChunkSize"

        # Execute the PowerShell script using the configurable path
        & $ScriptPath `
          -Source $SourceFolder `
          -OutputFolder $OutputFolder `
          -MaxChunkSize $MaxChunkSize

        echo "PowerShell preprocessing script completed."

    - name: 'Sync processed files to Azure Blob Storage'
      uses: azure/cli@v1
      with:
        inlineScript: |
          DEST_PREFIX="${{ steps.resolve-option.outputs.script_output_folder }}"
          SOURCE_DIRECTORY="${{ github.workspace }}/${{ steps.resolve-option.outputs.script_output_folder }}"

          if [ -d "$SOURCE_DIRECTORY" ] && [ "$(ls -A "$SOURCE_DIRECTORY")" ]; then
            az storage blob upload-batch \
              --account-name "${{ github.event.inputs.storage_account }}" \
              --destination "${{ github.event.inputs.container_name }}/$DEST_PREFIX" \
              --source "$SOURCE_DIRECTORY" \
              --overwrite \
              --auth-mode login
            echo "Synced to Azure Blob: $DEST_PREFIX/"
          else
            echo "No files found to sync at: $SOURCE_DIRECTORY"
          fi


    - name: Azure logout
      if: always()
      run: |
        az logout
        az cache purge
        az account clear
