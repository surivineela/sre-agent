# .github/workflows/pull-doc-cli.yml

name: Pull Agent Search Docs

on:
  workflow_dispatch:
    inputs:
      github_repo:
        description: 'The GitHub repository to pull CLI docs'
        required: true
        type: string
        default: 'MicrosoftDocs/azure-docs-cli'
      storage_account:
        description: 'Azure Storage Account name'
        required: true
        type: string
        default: 'stsrchfe4ozut5zosje'
      container_name:
        description: 'Blob Container name'
        required: true
        type: string
        default: 'test1'
      script_path:
        description: 'Path to the PowerShell script within the script_repo (e.g., script/preprocess-az-cli-doc.ps1)'
        required: true
        type: string
        default: 'scripts/preprocess-az-cli-doc.ps1'
      script_source_path:
        description: 'Source path for the script (e.g., azure-docs-cli/docs-ref-autogen/Latest-version/latest)'
        required: true
        type: string
        default: 'azure-docs-cli/docs-ref-autogen/Latest-version/latest'
      script_output_folder:
        description: 'Relative output folder for processed files (e.g., azclidoc-full-2)'
        required: true
        type: string
        default: 'azclidoc-full-2'
      script_max_chunk_size:
        description: 'Max chunk size parameter for the PowerShell script (e.g., 1800)'
        required: false
        type: number
        default: 1800

  repository_dispatch:
    types: [SRE-Agent-PullDoc-Sync]

permissions:
  id-token: write # Required for Azure Login using OIDC
  contents: read # Required for actions/checkout

jobs:
  sync-github-repo-to-storage:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: 'Echo Workflow Inputs and Variables'
      run: |
        echo "AZURE_CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}"
        echo "AZURE_TENANT_ID=${{ vars.AZURE_TENANT_ID }}"
        echo "AZURE_SUBSCRIPTION_ID=${{ vars.AZURE_SUBSCRIPTION_ID }}"
        echo "STORAGE_ACCOUNT_NAME=${{ github.event.inputs.storage_account }}"
        echo "CONTAINER_NAME=${{ github.event.inputs.container_name }}"
        echo "SCRIPT_REPO=${{ github.event.inputs.script_repo }}"
        echo "SCRIPT_PATH=${{ github.event.inputs.script_path }}"
        echo "SCRIPT_SOURCE_PATH=${{ github.event.inputs.script_source_path }}"
        echo "SCRIPT_OUTPUT_FOLDER=${{ github.event.inputs.script_output_folder }}"
        echo "SCRIPT_MAX_CHUNK_SIZE=${{ github.event.inputs.script_max_chunk_size }}"

    - name: 'Azure Login using OIDC'
      uses: azure/login@v1
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: 'Checkout this Repository (for script)'
      uses: actions/checkout@v4
      with:
        # This checks out the repository where the workflow file itself resides.
        # This is where /script folder and preprocess-az-cli-doc.ps1 located.
        repository: ${{ github.repository }}
        ref: ${{ github.ref }} # Checkout the current branch/ref
        fetch-depth: 1 # Shallow clone for speed
        path: . # Checkout into the root of the workspace

    - name: 'Checkout Docs Repository'
      uses: actions/checkout@v4
      with:
        repository: ${{ github.event.inputs.github_repo || 'MicrosoftDocs/azure-docs-cli' }}
        ref: main
        path: azure-docs-cli
        fetch-depth: 1 # Shallow clone for speed

    - name: 'Run PowerShell Preprocessing Script'
      shell: pwsh # Specifies PowerShell Core as the shell
      run: |
        $SourceFolder = "${{ github.workspace }}/${{ github.event.inputs.script_source_path }}"
        $OutputFolder = "${{ github.workspace }}/${{ github.event.inputs.script_output_folder }}"
        $MaxChunkSize = ${{ github.event.inputs.script_max_chunk_size }}

        # The PowerShell script itself handles creating the output folder if it doesn't exist.
        # No need to duplicate that logic here in the workflow.
        Write-Host "Running preprocessing script..."
        Write-Host "Source Folder: $SourceFolder"
        Write-Host "Output Folder: $OutputFolder"
        Write-Host "Max Chunk Size: $MaxChunkSize"

        # Execute the PowerShell script using the configurable path
        & "${{ github.workspace }}/${{ github.event.inputs.script_path }}" `
          -Source $SourceFolder `
          -OutputFolder $OutputFolder `
          -MaxChunkSize $MaxChunkSize

        echo "PowerShell preprocessing script completed."

    - name: 'Sync processed files to Azure Blob Storage'
      uses: azure/cli@v1
      with:
        inlineScript: |
          echo "Starting sync of processed files to Azure Blob Storage..."
          STORAGE_ACCOUNT_NAME="${{ github.event.inputs.storage_account }}"
          CONTAINER_NAME="${{ github.event.inputs.container_name }}"
          # The source directory for upload is now the output folder created by the PowerShell script
          SOURCE_DIRECTORY="${{ github.workspace }}/${{ github.event.inputs.script_output_folder }}"

          # Check if the SOURCE_DIRECTORY exists and contains files before attempting upload
          if [ -d "$SOURCE_DIRECTORY" ] && [ "$(ls -A "$SOURCE_DIRECTORY")" ]; then
            az storage blob upload-batch \
              --account-name "$STORAGE_ACCOUNT_NAME" \
              --destination "$CONTAINER_NAME" \
              --source "${SOURCE_DIRECTORY}" \
              --overwrite \
              --auth-mode login
            echo "Sync of processed files complete."
          else
            echo "Skipping blob upload: Source directory '$SOURCE_DIRECTORY' does not exist or is empty."
          fi

    - name: Azure logout
      if: always()
      run: |
        az logout
        az cache purge
        az account clear
