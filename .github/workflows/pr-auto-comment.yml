name: Auto Comment on Pull Request

on:
  pull_request_target:
    types: [opened]

jobs:
  add-comment:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Add comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { issue: { number: issue_number }, repo: { owner, repo } } = context;
            github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: 'Please manually add the "/azp run" comment to your PR to trigger pull request validation'
            });
