<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Background -->
  <rect width="800" height="400" fill="#F0F0F0"/>
  
  <!-- Title -->
  <text x="20" y="40" font-size="24" font-weight="bold">Components</text>
  <line x1="20" y1="45" x2="200" y2="45" stroke="black" stroke-width="1"/>
  
  <!-- Left Column Components -->
  <g>
    <!-- Discovery -->
    <rect x="50" y="80" width="120" height="50" rx="5" fill="#195973"/>
    <text x="110" y="110" text-anchor="middle" fill="white">Discovery</text>
    
    <!-- Reasoning -->
    <rect x="50" y="180" width="120" height="50" rx="5" fill="#195973"/>
    <text x="110" y="205" text-anchor="middle" fill="white">Reasoning</text>
    <text x="110" y="220" text-anchor="middle" fill="white" font-size="12">(Proactive)</text>
    
    <!-- Actions -->
    <rect x="50" y="280" width="120" height="50" rx="5" fill="#195973"/>
    <text x="110" y="310" text-anchor="middle" fill="white">Actions</text>
    
    <!-- Vertical Arrows -->
    <path d="M110 130 L110 180" stroke="#195973" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M110 230 L110 280" stroke="#195973" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Arrow Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#195973"/>
    </marker>
  </defs>

  <!-- Middle Sections -->
  <g>
    <!-- Top Section -->
    <rect x="220" y="62" width="330" height="86" rx="15" fill="#E0E0E0" stroke="#ccc"/>
    <rect x="270" y="75" width="100" height="30" rx="5" fill="#195973"/>
    <text x="320" y="95" text-anchor="middle" fill="white">Permissions</text>
    <rect x="270" y="110" width="100" height="30" rx="5" fill="#195973"/>
    <text x="320" y="130" text-anchor="middle" fill="white" font-size="12">Discovery tools</text>

    <!-- Middle Section -->
    <rect x="220" y="162" width="330" height="86" rx="15" fill="#E0E0E0" stroke="#ccc"/>
    <rect x="270" y="175" width="140" height="30" rx="5" fill="#4CAF50"/>
    <text x="340" y="195" text-anchor="middle" fill="white">Knowledge Graph</text>
    <rect x="270" y="210" width="100" height="30" rx="5" fill="#195973"/>
    <text x="320" y="230" text-anchor="middle" fill="white">Tools</text>
    <rect x="420" y="175" width="120" height="30" rx="5" fill="#195973"/>
    <text x="480" y="195" text-anchor="middle" fill="white" font-size="12">Best Practices CoT</text>

    <!-- Bottom Section -->
    <rect x="220" y="262" width="330" height="86" rx="15" fill="#E0E0E0" stroke="#ccc"/>
    <rect x="270" y="275" width="140" height="30" rx="5" fill="#4CAF50"/>
    <text x="340" y="295" text-anchor="middle" fill="white">Knowledge Graph</text>
    <rect x="270" y="310" width="100" height="30" rx="5" fill="#195973"/>
    <text x="320" y="330" text-anchor="middle" fill="white">Tools</text>
    <rect x="420" y="275" width="120" height="30" rx="5" fill="#195973"/>
    <text x="480" y="295" text-anchor="middle" fill="white" font-size="12">Remediation CoT</text>
  </g>

  <!-- Right Column Outputs -->
  <g>
    <!-- Knowledge Graph -->
    <rect x="600" y="80" width="160" height="50" rx="5" fill="#4CAF50"/>
    <text x="680" y="110" text-anchor="middle" fill="white">Knowledge Graph</text>
    
    <!-- Identify Actions -->
    <rect x="600" y="180" width="160" height="50" rx="5" fill="#4CAF50"/>
    <text x="680" y="200" text-anchor="middle" fill="white">Identify Actions</text>
    <text x="680" y="220" text-anchor="middle" fill="white" font-size="12">Workflows</text>
    
    <!-- Goal State -->
    <rect x="600" y="280" width="160" height="50" rx="5" fill="#4CAF50"/>
    <text x="680" y="310" text-anchor="middle" fill="white">Goal State</text>
  </g>

  <!-- Horizontal Arrows -->
  <g>
    <path d="M170 105 L220 105" stroke="#195973" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M550 105 L600 105" stroke="#195973" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M170 205 L220 205" stroke="#195973" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M550 205 L600 205" stroke="#195973" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M170 305 L220 305" stroke="#195973" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M550 305 L600 305" stroke="#195973" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>
</svg>
