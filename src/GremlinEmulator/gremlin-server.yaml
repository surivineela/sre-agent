host: 172.17.0.2
port: 8182
graphs: {
  empty: /opt/gremlin-server/custom-conf/tinkergraph-stringid.properties,
  functionsBadFlexApps: /opt/gremlin-server/custom-conf/tinkergraph-stringid.properties,
  simpleWebApps: /opt/gremlin-server/custom-conf/tinkergraph-stringid.properties,
  funcScenarios1: /opt/gremlin-server/custom-conf/tinkergraph-stringid.properties,
  mrsharmAcaDiag: /opt/gremlin-server/custom-conf/tinkergraph-stringid.properties
