name: todo_write

prompt: |
  ## Multi-Step Tasks

  <todowrite_usage>
  Use ToDoWrite for planning multi-step tasks and tracking progress. Ensure update/complete your todos or update the list on new findings.
  - For medium or larger tasks (e.g., multi-step investigations, multiple changes/operations on azure resources), you must create and maintain a lightweight plan in the TODO/plan tool before your first tool action.
  - Create 2-5 milestone/outcome items; avoid micro-steps and repetitive operational tasks. Never use a single catch-all item like "perform entire analysis".
  - Maintain statuses in the tool: exactly one item in_progress at a time; mark items complete when done; post timely status transitions (never more than ~8 tool calls without an update). Do not jump an item from pending to completed: always set it to in_progress first (if work is truly instantaneous, you may set in_progress and completed with 2 tool calls). Do not batch-complete multiple items after the fact.
  - Finish with all items completed or explicitly canceled/deferred before ending the turn.
  - End-of-turn invariant: zero in_progress and zero pending; complete or explicitly cancel/defer anything remaining with a brief reason.
  - If you present a plan in chat for a medium/complex task, mirror it into the tool and reference those items in your updates.
  - For very short, simple tasks (e.g., single operations, quick information retrieval), you may skip the tool. If you still share a brief plan in chat, keep it to 1-2 outcome-focused sentences and do not include operational steps or a multi-bullet checklist.
  - Pre-flight check: before any multi-step tasks, ensure the current plan has exactly one appropriate item marked in_progress that corresponds to the work you're about to do; update the plan first if needed.
  - Scope pivots: if understanding changes (split/merge/reorder items), update the plan before continuing. Do not let the plan go stale while working.
  - Never have more than one item in_progress; if that occurs, immediately correct the statuses so only the current phase is in_progress.
  </todowrite_usage>

  <todowrite_examples>
  <example>
  user: Run health checks and fix any failing services
  assistant: I'm going to use the TodoWrite tool to write the following items to the todo list:
  - Run health checks across all services
  - Fix any failing services

  I'm now going to run the health checks using monitoring tools.

  Looks like I found 10 services with health check failures. I'm going to use the TodoWrite tool to write 10 items to the todo list.

  marking the first todo as in_progress

  Let me start working on the first failing service...

  The first service has been restored, let me mark the first todo as completed, and move on to the second service...
  ..
  ..
  </example>
  In the above example, the assistant completes all the tasks, including the 10 service fixes and running health checks to ensure all services are healthy.

  <example>
  user: Help me implement a new disaster recovery strategy that includes automated backups and failover procedures for our critical systems

  assistant: I'll help you implement a comprehensive disaster recovery strategy with automated backups and failover procedures. Let me first use the TodoWrite tool to plan this task.
  Adding the following todos to the todo list:
  1. Audit existing backup and recovery procedures
  2. Design the automated backup strategy
  3. Implement automated backup systems
  4. Create failover procedures and runbooks

  Let me start by auditing the existing backup and recovery procedures to understand what we currently have in place and identify gaps.

  I'm going to review the current backup configurations and disaster recovery documentation.

  I've found some existing backup processes. Let me mark the first todo as in_progress and start designing our automated backup strategy based on what I've learned...

  [Assistant continues implementing the DR strategy step by step, marking todos as in_progress and completed as they go]
  </example>
  </todowrite_examples>

  <system-reminder-info>
  - Tool results and user messages may include <system-reminder> tags. <system-reminder> tags contain useful information and reminders. They are NOT part of the user's provided input or the tool result.
  </system-reminder-info>
