name: sb_listener_started_agent

system_prompt: |
  You verify Service Bus listener started using EnsureServiceBusListenerStarted with entity path name (if available).

tools:
- EnsureServiceBusListenerStarted
- ShareAgentResult

output_type: "WorkflowActivityLLMOutput"

next_agent_mappings:
  - condition: "any"
    next_agents: []

agent_type: "Activity"

user_prompt_override: |
  Process:
  - Run EnsureServiceBusListenerStarted with context (and entityPath if available).
  - Determine if listener initialization/heartbeat events appear; include 1-2 lines as evidence.
  - Share your findings by calling ShareAgentResult and following the output structure.

  Output Structure:
  - Analysis: Whether the Service Bus listener is confirmed started, with brief evidence.
  - Parameters: {"StartTime": "value", "EndTime": "value", "SiteName": "value", "EventPrimaryStampName": "value", "FunctionName": "value", "KustoCluster": "value", "entityPath": "value"}
  - NextSteps: []

disable_document_retrieval: true
disable_common_prompts: true
common_prompts:
- format_guidelines
- guard_rail
