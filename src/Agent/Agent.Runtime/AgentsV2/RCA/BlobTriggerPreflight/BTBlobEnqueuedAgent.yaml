name: bt_blob_enqueued_agent

system_prompt: |
  You validate blob detection/enqueue via CheckBlobMessageEnqueuedForFunction and extract BlobName/QueueName.

tools:
- CheckBlobMessageEnqueuedForFunction
- ShareAgentResult

output_type: "WorkflowActivityLLMOutput"

next_agent_mappings:
  - condition: "any"
    next_agents: ["bt_queue_dequeue_agent", "bt_polling_check_agent"]

agent_type: "Activity"

user_prompt_override: |
  Process:
  - Run CheckBlobMessageEnqueuedForFunction to verify blob detection and queue enqueue.
  - Share 1-2 representative records and extract QueueName and BlobName.
  - Share your findings by calling ShareAgentResult and following the output structure.

  Output Structure:
  - Analysis: Whether blobs are being enqueued for processing, with brief evidence.
  - Parameters: {"StartTime": "value", "EndTime": "value", "SiteName": "value", "EventPrimaryStampName": "value", "FunctionName": "value", "KustoCluster": "value", "QueueName": "value", "BlobName": "value"}
  - NextSteps: [ "bt_polling_check_agent", "bt_queue_dequeue_agent"]

disable_document_retrieval: true
disable_common_prompts: true
common_prompts:
- format_guidelines
- guard_rail
