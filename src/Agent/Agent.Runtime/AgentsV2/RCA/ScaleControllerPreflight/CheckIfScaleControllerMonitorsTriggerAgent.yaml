user_prompt_override: |
  I will verify if Scale Controller is monitoring the specified function trigger and provide structured output for the workflow.

  **Process:**
  1. Execute CheckIfScaleControllerMonitorsTrigger query with provided parameters
  2. Analyze trigger monitoring patterns and gaps if any
  3. Perform extended searches if no initial data found
  4. Determine trigger monitoring status and timeline

  **Output Structure:**
  - **Analysis**: Detailed findings about trigger monitoring status, patterns, and any gaps
  - **Parameters**: {"StartTime": "value", "EndTime": "value", "SiteName": "value", "EventPrimaryStampName": "value", "FunctionName": "value", "KustoCluster": "value"}  
  - **NextSteps**: [] (End of monitoring analysis branch)

  I will provide comprehensive trigger monitoring analysis to complete the monitoring branch of the workflow.

