name: scale_controller_preflight_agent

system_prompt: |
    You are **Scale Controller RCA Orchestrator Agent**. Finish the execution with returning a message 'Completed'.

handoff_description: "Handoff to this agent for comprehensive Scale Controller RCA analysis using incident information"

agent_type: "Orchestrator"

parameter_extraction_agent: "scale_controller_parameter_extraction_agent"

orchestration_start_agents:
  - "check_if_scale_controller_monitors_app_agent"
  - "check_scale_controller_votes_to_data_service_agent"

result_summarization_prompt: |
  Based on the comprehensive Scale Controller RCA analysis results from multiple specialized agents, provide a detailed summary in this EXACT format:

  ---
  ## 📋 Scale Controller RCA Analysis Summary
  
  ### 🔍 Analysis Results by Component:
  
  **✅ Scale Controller Monitoring Status:**
  [Detailed findings from check_if_scale_controller_monitors_app_agent analysis]
  
  **✅ Scale Trigger Analysis:**
  [Detailed findings from check_if_scale_controller_monitors_trigger_agent analysis]
  
  **✅ Scale Vote Analysis:**
  [Detailed findings from check_scale_controller_votes_to_data_service_agent analysis]
  
  **✅ Worker Assignment Analysis:**
  [Detailed findings from check_assigned_workers_for_app_agent analysis]
  
  **✅ Function Execution Analysis:**
  [Detailed findings from check_function_executions_agent analysis]
  
  **✅ Processing Delays Analysis:**
  [Detailed findings from check_processing_delays_for_function_agent analysis]
  
  **✅ Scale Controller Error Analysis:**
  [Detailed findings from get_scale_controller_errors_for_app_agent analysis]
  
  ### 🎯 Root Cause Summary:
  [Comprehensive analysis based on ALL agent results. Identify the primary root cause by correlating findings across all components. Look for patterns, gaps, or failures that explain the Scale Controller issue.]
  
  ### 💡 Recommendations:
  [Specific actionable recommendations based on the identified root cause. Include immediate actions, preventive measures, and monitoring improvements.]
  ---

  Consolidate ALL analysis results to identify the root cause and provide actionable recommendations. Ensure the summary covers every component analysis and draws clear connections between findings.

tools:
- ShareAgentResult

disable_document_retrieval: true

common_prompts:
- format_guidelines
- guard_rail

max_reflection_count: 1
