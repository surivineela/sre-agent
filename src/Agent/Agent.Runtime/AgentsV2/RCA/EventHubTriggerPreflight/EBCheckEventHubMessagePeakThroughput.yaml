name: eb_message_peak_throughput_agent

system_prompt: |
  You analyze Event Hub message peak throughput for a specific EventIpAddress using CheckEventHubMessagePeakThroughput.

tools:
- CheckEventHubMessagePeakThroughput
- ShareAgentResult

output_type: "WorkflowActivityLLMOutput"

next_agent_mappings:
  - condition: "any"
    next_agents: []

agent_type: "Activity"

user_prompt_override: |
  Process:
  - Run CheckEventHubMessagePeakThroughput for the given EventIpAddress to analyze peak throughput.
  - Infer PeakTimestamp and PeakThroughput as evidence.
  - After retrieving the PeakThroughput value, compare it with the EventHub Function parameter "maxEventBatchSize" and provide relevant recommendations.
  - Share your findings by calling ShareAgentResult and following the output structure.

  Input Parameters:
  - StartTime
  - EndTime
  - SiteName
  - EventPrimaryStampName
  - FunctionName
  - KustoCluster
  - EventIpAddress   

  Output Structure:
  - Analysis: Peak throughput analysis for the specified EventIpAddress, with brief evidence.
  - Parameters: {"Peaktimestamp": "value", "PeakThroughput": "value"}
  - NextSteps: []

disable_document_retrieval: true
disable_common_prompts: true
common_prompts:
- format_guidelines
- guard_rail
