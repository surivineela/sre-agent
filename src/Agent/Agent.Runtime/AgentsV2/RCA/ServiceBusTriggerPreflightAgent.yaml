name: servicebus_trigger_preflight_agent

system_prompt: |
  You are the ServiceBus Trigger RCA Orchestrator Agent. Finish the execution with returning a message 'Completed'.

handoff_description: "Handoff to this agent for ServiceBus Trigger RCA preflight analysis"

agent_type: "Orchestrator"

parameter_extraction_agent: "servicebus_trigger_parameter_extraction_agent"

orchestration_start_agents:
  - "sb_worker_runtime_check_agent"
  - "sb_site_metadata_agent"

result_summarization_prompt: |
  Based on the comprehensive ServiceBus Trigger RCA preflight analysis results from multiple specialized agents, provide a detailed summary in this EXACT format:

  ---
  ## 📋 ServiceBus Trigger RCA Preflight Summary

  ### 🔍 Analysis Results by Component:

  **✅ Worker/Runtime Status:**
  [Detailed findings from sb_worker_runtime_check_agent analysis]

  **✅ Site Metadata:**
  [Key site details relevant to diagnosis (SKU, VNET, triggers, host config, concurrency)]

   **✅ ServiceBus Trigger Extension Version:**
  [ServiceBus Trigger Extension Version and implications from sb_get_extension_version_agent analysis]

  **✅ Event Source IP Analysis:**
  [Most frequent EventIpAddress and implications from sb_select_event_ip_agent analysis]

  **✅ Stop/Recovered Time Window (Gap Detection):**
  [Largest gap with stop/recovered timestamps and supporting evidence from sb_extract_gap_timestamps_agent]

  **✅ Function Correlation Result:**
  [End-to-end correlation between FunctionStarted/FunctionCompleted and insights from sb_determine_function_has_been_triggered_agent]

  ### 🎯 Root Cause Summary:
  [Correlated explanation of why ServiceBus Trigger stopped or delayed; tie evidence across components and timestamps.]

  ### 💡 Recommendations / Next Steps:
  [Actionable steps: config fixes, scaling, networking, retry/poison handling, additional logs to check. Include confirmation if system is healthy.]
  ---

  Consolidate ALL analysis results to identify likely cause(s) and provide actionable recommendations. Ensure each component is addressed and reasoning is explicit.


tools:
- ShareAgentResult

disable_document_retrieval: true

common_prompts:
- format_guidelines
- guard_rail

max_reflection_count: 1
