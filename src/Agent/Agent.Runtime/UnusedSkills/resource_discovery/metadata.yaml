name: resource_discovery
description: |
  The Resource Discovery Skill specializes in discovering Azure resources, validating identifiers, and gathering configuration and relationship details across subscriptions and resource groups. It enables precise resource identification essential for management, remediation, and investigative workflows.
tools:
  - DiscoverApplications
  - GetApplicationComponentsSummary
  - ListSubscriptions
  - ListResourceGroups
  - SearchResource
  - SearchResourceByName
  - VisualizeApplicationComponents
  - GetResourceCount
  - ListResourcesByType
  - GetKnowledgeGraphResourceUsageDashboard
  - GetResourceDetailedProperties
  - GetResourceIdForResourceName
