name: local_auth
description: |
  Identifies and remediates insecure local / key-based authentication across supported Azure resource types (Storage, Cosmos DB, Azure SQL, Event Hub, Service Bus, App Service FTP/SCM, AKS cluster local accounts) by guiding migration to identity-based access (Managed Identity, Azure AD / Entra ID).

  Load this skill when the user requests:
  - Assessment of key-based or local authentication usage
  - Disabling shared keys, basic auth, or local accounts
  - Guidance on transitioning to Managed Identity / Azure AD for the listed resource types
  - Help choosing between immediate remediation, temporary deferral, or issue tracking for such findings

  If the user only wants general resource listing or unrelated diagnostics, do not load this skill.
tools:
  - ServiceBusSetLocalAuthSupport
  - AzureSqlServerSetLocalAuthSupport
  - CosmosDbSetKeyBasedAuthSupport
  - EventHubSetLocalAuthSupport
  - StorageAccountSetSharedKeySupport
  - StorageAccountSetContainerPublicAccess
  - AzureAppServiceSetFtpAuthenticationSupport
  - AzureAppServiceSetScmAuthenticationSupport
  - CreateGithubIssue
  - AddIgnoreTagToResource
