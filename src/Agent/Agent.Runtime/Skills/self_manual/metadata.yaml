name: self_manual
description: |
  Load this skill when the user asks about:
    - What the agent can do (capabilities, functionality, feature overview)
    - How to configure, validate, or troubleshoot incident management integrations (PagerDuty, Azure Monitor alerts & action groups)
    - Billing, cost drivers, or cost optimization across alerting/logs/integrations
    - End-to-end setup guidance for manual/integration topics (not general resource diagnostics)

  Do NOT load for: generic resource searches, performance diagnostics, or service-specific troubleshooting unrelated to capabilities/manual/integration/billing.

  Purpose: Provide concise manual guidance, configuration patterns, billing estimation practices
tools:
  - SearchDocuments
