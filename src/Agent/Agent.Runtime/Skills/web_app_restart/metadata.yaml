name: web_app_restart
description: |
  Load this skill ONLY after the target Azure Web App (App Service) resource context is established and the user asks about: unexpected restarts, crash loops, intermittent downtime tied to process recycling, or suspected deployment/config changes causing instability.
  Purpose: Provide focused, evidence-based diagnosis of restart events; correlate restarts with exceptions, failed requests, deployments, configuration changes, resource utilization, and dependency failures; produce a concise root cause (or ranked hypotheses) plus actionable remediation.
  Trigger phrases/examples: "Why does my web app keep restarting?", "Frequent app service restarts", "App recycled after deployment", "Downtime after slot swap", "Crash loop in web app".
  Do NOT load for general listing of resources, basic property retrieval, or non-restart performance questions (use general tools instead). If the issue evolves into non-restart performance tuning, conclude this skill's use and proceed without reloading it.
tools:
  - GetWebAppRestartExecution
  - PlotTimeSeriesData
  - PlotBarChart
