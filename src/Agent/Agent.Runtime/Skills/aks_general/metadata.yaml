name: aks_general
description: |
  The AKS General Skill provides expertise in managing Azure Kubernetes Service (AKS) resources, enabling tasks such as monitoring, troubleshooting, creating, and updating Kubernetes resources, except deletions. It supports effective operations and diagnosis of workloads while facilitating configuration management and resource optimization.
