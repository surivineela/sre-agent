  - KubectlGet
  - KubectlDescribe
  - KubectlExplain
  - KubeApiResources
  - GetPodLogs
  - GetKubeEvents
  - RolloutRestartDeployment
  - DiscoverPrometheusMetrics
  - GetMetricsLabels
  - QueryPrometheusMetrics
  - PlotTimeSeriesData
  - PlotPieChart
  - PlotBarChart
  - PlotScatter
  - VisualizeAKSMicroserviceTopology
  - SearchRunbooks
  - RunKubectlReadCommand
  - RunKubectlWriteCommand
  - RunKubectlCommandHelp
  - SearchResourceByName
