name: GetEnvoyControllerLogs
type: KustoTool
connector: capps-kusto-connector
description: |
  Retrieves logs from the Envoy controller to troubleshoot ingress and routing errors in Container Apps.

mode: query
function: GetEnvoyControllerLogs
query: |
  AllCapps("K8SEBillingPodEvents")
  | where msg == "IdleInfo"
  | take 1
file: Logs/GetControllerLogs.kql  
database: AppLogsDB               
clusterHint: capps-westus         

parameters:
  - name: fromDate
    type: string
    required: true
    description: Start time for filtering the logs
    mapTo: args
    target: dictionary:args:string

  - name: toDate
    type: string
    required: true
    description: End time for filtering the logs
    mapTo: args
    target: dictionary:args:string

  - name: region
    type: string
    required: true
    description: Azure region of the managed environment
    mapTo: region
    target: direct

  - name: managedClusterName
    type: string
    required: true
    description: Name of the Kubernetes cluster
    mapTo: args
    target: dictionary:args:string

  - name: groupName
    type: string
    required: false
    default: ContainerApps
    description: The Azure resource group or logical grouping for the query
    mapTo: groupName
    target: direct

  - name: sampling
    type: boolean
    required: false
    default: false
    description: Whether to use sampling on large datasets
    mapTo: direct

attributes:
  - ApprovalRequired

metadata:
  owner: platform-networking
  version: 1.0
  tags: [ingress, envoy, diagnostics]
  lastUpdated: 2025-07-17
