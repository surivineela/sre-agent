testSuite:
  name: KeyVaultSecretsLastUpdated
  description: Evaluates agent's ability to get information about when secrets across multiple keyvaults were updated
  configuration:
    timeout: 2m
    database: gsreAgentPbatumDev
    toolReplay:
      logDirectory: KeyVaultSecretsLastUpdated
      skipReplayFunctions:
      - GraphDBPluginDefinition.*
      fuzzyMatchFunctions:
      - ChartPluginDefinition.*
  plugins:
  - ContainerAppPluginDefinition
  - DiagnosticsPluginDefinition
  - ArmPluginDefinition
  - NSGRulePluginDefinition
  - PagerDutyIncidentPluginDefinition
  - ChartPluginDefinition
  - GraphDBPluginDefinition
  - SearchPluginDefinition

  testCases:
  - name: SummarizeKeyVaultSecretsLastUpdated
    startMessages:
    - summarize when the secrets in my keyvaults were last updated
    - Tell me the last time secrets were updated in my key vaults    
    evaluation:
      groundedContext: >-
        ## Ground Truth:

        1. The user requests a summary of the last updated timestamps for secrets in all their Azure Key Vaults.

        2. The environment contains three Key Vaults: 
           - pbatum-sre3-kv (Resource Group: pbatum-sre3-operations-agent-3p-rg)
           - pbatum-sre2-kv (Resource Group: pbatum-sre2-operations-agent-3p-rg)
           - pbatum-sre4-kv (Resource Group: pbatum-sre4-operations-agent-3p-rg)
        3. Each Key Vault contains the following secrets and update times:
           - pbatum-sre3-kv:
              - app-insights-connection-string: 2025-03-24T19:17:52+00:00
              - docs-cosmos-api-key: 2025-03-24T19:19:11+00:00
              - graph-cosmos-api-key: 2025-03-24T19:19:12+00:00
              - openai-api-key: 2025-03-24T19:17:50+00:00
           - pbatum-sre2-kv:
              - app-insights-connection-string: 2025-03-17T21:53:38+00:00
              - docs-cosmos-api-key: 2025-03-17T21:54:58+00:00
              - graph-cosmos-api-key: 2025-03-17T21:54:40+00:00
              - openai-api-key: 2025-03-17T21:54:01+00:00
           - pbatum-sre4-kv:
              - app-insights-connection-string: 2025-04-21T21:36:54+00:00
              - graph-cosmos-api-key: 2025-04-21T21:38:19+00:00
              - openai-api-key: 2025-04-21T21:36:51+00:00
        4. The correct process for the agent is:
           - Discover all accessible Key Vaults if user context is not specified
           - For each Key Vault, enumerate secrets
           - For each secret, retrieve the 'last updated' timestamp
           - Summarize results for the user in a readable format (markdown table or list)
        5. The agent successfully discovers the vaults, enumerates all relevant secrets, and provides a summary to the user.

        6. The answer should clearly present the Key Vault names, secret names, and their respective last updated timestamps.
      exampleResponse: >-
        Here is a summary of when the secrets in your Key Vaults were last updated:


        | Key Vault         | Secret Name                   | Last Updated (UTC)        |

        |-------------------|------------------------------|---------------------------|

        | pbatum-sre3-kv    | app-insights-connection-string| 2025-03-24T19:17:52+00:00 |

        | pbatum-sre3-kv    | docs-cosmos-api-key           | 2025-03-24T19:19:11+00:00 |

        | pbatum-sre3-kv    | graph-cosmos-api-key          | 2025-03-24T19:19:12+00:00 |

        | pbatum-sre3-kv    | openai-api-key                | 2025-03-24T19:17:50+00:00 |

        | pbatum-sre2-kv    | app-insights-connection-string| 2025-03-17T21:53:38+00:00 |

        | pbatum-sre2-kv    | docs-cosmos-api-key           | 2025-03-17T21:54:58+00:00 |

        | pbatum-sre2-kv    | graph-cosmos-api-key          | 2025-03-17T21:54:40+00:00 |

        | pbatum-sre2-kv    | openai-api-key                | 2025-03-17T21:54:01+00:00 |

        | pbatum-sre4-kv    | app-insights-connection-string| 2025-04-21T21:36:54+00:00 |

        | pbatum-sre4-kv    | graph-cosmos-api-key          | 2025-04-21T21:38:19+00:00 |

        | pbatum-sre4-kv    | openai-api-key                | 2025-04-21T21:36:51+00:00 |


        Let me know if you need a breakdown by vault or want to see only the most recently updated secrets per vault.
      assertions:
        equivalence:
          minimumScore: 4
        groundedness:
          minimumScore: 4
      autoReply:
        defaultReply: Please do your best to figure it out.
