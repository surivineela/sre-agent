# Application Configuration for PartialResultManager Tests
application:
  name: SRE Agent Runtime
  version: 2.1.0
  environment: production
  region: eastus
  
server:
  host: 0.0.0.0
  port: 8080
  ssl:
    enabled: true
    certificate_path: /etc/ssl/certs/app.crt
    key_path: /etc/ssl/private/app.key
    protocols:
      - TLSv1.2
      - TLSv1.3
  timeouts:
    read_timeout: 30s
    write_timeout: 30s
    idle_timeout: 120s
  
database:
  primary:
    host: prod-sql-01.database.windows.net
    port: 1433
    database: sreagent_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool_size: 20
    connection_timeout: 10s
    ssl_mode: require
  
  replica:
    host: prod-sql-replica-01.database.windows.net
    port: 1433
    database: sreagent_db
    username: ${DB_REPLICA_USERNAME}
    password: ${DB_REPLICA_PASSWORD}
    pool_size: 10
    read_only: true
  
redis:
  cluster:
    enabled: true
    nodes:
      - redis-node-1.cache.windows.net:6379
      - redis-node-2.cache.windows.net:6379
      - redis-node-3.cache.windows.net:6379
  password: ${REDIS_PASSWORD}
  database: 0
  max_retries: 3
  retry_delay: 500ms
  
logging:
  level: info
  format: json
  outputs:
    - type: console
      level: info
    - type: file
      level: debug
      path: /var/log/app/application.log
      max_size: 100MB
      max_backups: 10
      compress: true
    - type: syslog
      level: warn
      host: syslog.contoso.com
      port: 514
      protocol: tcp
  
  structured:
    enabled: true
    include_caller: true
    include_stack_trace: true
  
monitoring:
  metrics:
    enabled: true
    port: 9090
    path: /metrics
    interval: 15s
    
  tracing:
    enabled: true
    provider: opentelemetry
    endpoint: http://otel-collector:4317
    sample_rate: 0.1
    
  health_checks:
    enabled: true
    port: 8081
    path: /health
    checks:
      - name: database
        type: database
        interval: 30s
        timeout: 5s
      - name: redis
        type: redis
        interval: 30s
        timeout: 5s
      - name: api_gateway
        type: http
        url: http://api-gateway/health
        interval: 60s
        timeout: 10s

security:
  authentication:
    type: oauth2
    provider: azure_ad
    tenant_id: ${AZURE_TENANT_ID}
    client_id: ${AZURE_CLIENT_ID}
    client_secret: ${AZURE_CLIENT_SECRET}
    scopes:
      - openid
      - profile
      - email
      - api://sreagent/user.read
  
  authorization:
    enabled: true
    default_policy: deny
    roles:
      - name: admin
        permissions:
          - read
          - write
          - delete
          - admin
      - name: operator
        permissions:
          - read
          - write
      - name: viewer
        permissions:
          - read
  
  rate_limiting:
    enabled: true
    default_limit: 1000
    window: 1h
    by_user: true
    endpoints:
      - path: /api/v1/*
        limit: 5000
        window: 1h
      - path: /api/v1/incidents
        limit: 100
        window: 1m
      - path: /api/v1/auth/login
        limit: 10
        window: 15m

integrations:
  incident_management:
    - name: icm
      type: microsoft_icm
      enabled: true
      endpoint: https://icm.microsoft.com/api
      api_key: ${ICM_API_KEY}
      timeout: 30s
      
    - name: pagerduty
      type: pagerduty
      enabled: true
      api_key: ${PAGERDUTY_API_KEY}
      timeout: 30s
  
  monitoring:
    - name: prometheus
      type: prometheus
      enabled: true
      endpoint: http://prometheus:9090
      
    - name: grafana
      type: grafana
      enabled: true
      endpoint: http://grafana:3000
      api_key: ${GRAFANA_API_KEY}
  
  notification:
    - name: email
      type: smtp
      enabled: true
      host: smtp.office365.com
      port: 587
      username: ${SMTP_USERNAME}
      password: ${SMTP_PASSWORD}
      from: noreply@contoso.com
      use_tls: true
      
    - name: teams
      type: microsoft_teams
      enabled: true
      webhook_url: ${TEAMS_WEBHOOK_URL}
      
    - name: slack
      type: slack
      enabled: false
      webhook_url: ${SLACK_WEBHOOK_URL}

features:
  ai_insights:
    enabled: true
    model: gpt-4
    temperature: 0.7
    max_tokens: 2000
    
  auto_remediation:
    enabled: false
    require_approval: true
    
  anomaly_detection:
    enabled: true
    sensitivity: medium
    lookback_window: 7d
    
  predictive_analysis:
    enabled: true
    confidence_threshold: 0.85

performance:
  cache:
    ttl: 5m
    max_entries: 10000
    eviction_policy: lru
    
  connection_pool:
    min_size: 10
    max_size: 100
    max_idle_time: 10m
    
  thread_pool:
    core_threads: 10
    max_threads: 50
    queue_size: 1000
    keep_alive_time: 60s

backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention_days: 30
  destinations:
    - type: azure_blob
      container: sreagent-backups
      connection_string: ${BACKUP_STORAGE_CONNECTION_STRING}
    - type: s3
      bucket: sreagent-backups-s3
      region: us-east-1
      access_key: ${AWS_ACCESS_KEY}
      secret_key: ${AWS_SECRET_KEY}
