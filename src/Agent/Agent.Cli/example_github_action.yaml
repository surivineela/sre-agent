name: Validate SRE Agents

on:
  push:
    paths:
      - 'agents/**'
      - '.github/workflows/validate-agents.yml'
  pull_request:
    paths:
      - 'agents/**'

jobs:
  validate-agents:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build SREAgent CLI
        run: dotnet publish Agent.Cli/Agent.Cli.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true

      - name: Validate all agents
        run: |
          ./Agent.Cli/bin/Release/net9.0/win-x64/publish/Agent.Cli.exe agent validate --all
