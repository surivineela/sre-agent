name: test-tool
type: KustoTool
connector: my-kusto-connector
description: Sample Kusto tool for querying logs
mode: query
database: MyDatabase
cluster_hint: westus
query: |
  MyTable
  | where TimeGenerated > ago(1h)
  | summarize count() by OperationName
parameters:
  - name: timeRange
    type: string
    required: true
    description: Time range for the query
    map_to: args
    target: dictionary:args:string