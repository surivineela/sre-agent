trigger:
  - main

pool:
  vmImage: 'windows-latest'

steps:
- checkout: self

- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '9.0.x'

- script: dotnet publish Agent.Cli/Agent.Cli.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true
  displayName: 'Build SREAgent CLI'

- script: |
    ./Agent.Cli/bin/Release/net9.0/win-x64/publish/Agent.Cli.exe agent validate --all
  displayName: 'Validate all agents'
