#################################################################################
#                               OneBranch Pipelines                             #
# Documentation:  https://aka.ms/obpipelines                                    #
# Yaml Schema:    https://aka.ms/obpipelines/yaml/schema                        #
# Retail Tasks:   https://aka.ms/obpipelines/tasks                              #
# Support:        https://aka.ms/onebranchsup                                   #
#################################################################################

name: $(MAJOR).$(MINOR).$(BUILD).$(REVISION)

trigger:
  batch: true  # Only trigger one build at a time, batching commits together
  branches:
    include:
    - main

# global parameters are configured here and show up in AzDO UI in build queue time. Required for MSBuild and .NET.
# learn more at https://aka.ms/obpipelines/parameters
parameters:
- name: 'debug'
  displayName: 'Enable debug output'
  type: boolean
  default: false
- name: 'publishPortalNuget'
  displayName: 'Publish Agent.Portal NuGet package to Azure Artifacts'
  type: boolean
  default: false

variables:
- name: isReleaseBranch
  value: $[startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')]
- name: branchVersion
  value: $[replace(variables['Build.SourceBranch'], 'refs/heads/release/', '')]
- name: MAJOR
  value: $[iif(eq(variables['isReleaseBranch'], true), split(variables['branchVersion'], '.')[0], format('{0:yy}', pipeline.startTime))]
- name: MINOR
  value: $[iif(eq(variables['isReleaseBranch'], true), split(variables['branchVersion'], '.')[1], format('{0:M}', pipeline.startTime))]
- name: BUILD
  value: $[iif(eq(variables['isReleaseBranch'], true), split(variables['branchVersion'], '.')[2], counter(variables['MINOR'], 0))]
- name: REVISION
  value: $[iif(eq(variables['isReleaseBranch'], true), counter(format('{0}.{1}.{2}', variables['MAJOR'], variables['MINOR'], variables['BUILD']), 1), 0)]

- template: /.pipelines/templates/Shared.1ES.Build.CommonVariables.yaml

extends:
  template: /.pipelines/templates/Shared.1ES.Build.yaml
  parameters:
    isOfficialBuild: true  # Force Official builds
    isNugetPublish: ${{ parameters.publishPortalNuget }}  # Pass through the NuGet publish parameter
