# Universal Windows Platform
# Build a Universal Windows Platform project using Visual Studio.
# Add steps that test and distribute an app, save build artifacts, and more:
# https://aka.ms/yaml

name: CreateBranch $(Build.SourceBranchName) Revision$(Rev:r)
trigger: none

variables:
  WindowsContainerImage: 'onebranch.azurecr.io/windows/ltsc2022/vse2022:latest' # for Windows jobs https://aka.ms/obpipelines/containers

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    featureFlags:
      EnableCDPxPAT: false
      WindowsHostVersion: 1ESWindows2022
    stages:
    - stage: build
      jobs:
      - job: main
        pool:
          type: windows
        variables:
          ob_outputDirectory: '$(Build.SourcesDirectory)\out'
        steps:
        - checkout: self
          displayName: 'Checkout $(Build.SourceBranchName)'
          persistCredentials: true
          clean: true

        - task: PowerShell@2
          displayName: 'Create New Release Branch'
          inputs:
            filePath: '$(Build.SourcesDirectory)\sreagent-runtime\.pipelines\New-ReleaseBranch.ps1'
            workingDirectory: '$(Build.SourcesDirectory)\sreagent-runtime'
