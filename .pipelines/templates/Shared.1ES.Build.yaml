#################################################################################
#                              Shared Build Pipeline                            #
#                                                                               #
#                               OneBranch Pipelines                             #
# Documentation:  https://aka.ms/onebranchrelease                               #
# Yaml Schema:    https://aka.ms/obpipelines/yaml/schema                        #
# Support:        https://aka.ms/onebranchsupport                               #
#################################################################################

# Please uncomment and provide values for the placeholders in the << >> notation:
# 1. The "dependsOn" in the download stage of the test stage example (if applicable)
# 2. The "ServiceRootPath" and "RolloutSpecPath" in each of the test stage example

parameters:
- name: 'isOfficialBuild'
  displayName: 'Enables or Disables an Official build and its configuration (signing and other build steps)'
  type: boolean
  default: false
- name: 'isNugetPublish'
  displayName: 'Enables publishing NuGet packages to Azure Artifacts'
  type: boolean
  default: false

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  ${{ if parameters.isOfficialBuild }}:
    template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  ${{ else }}:
    template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows

    authenticatedContainerRegistries:
    - serviceConnection: sreagentdev
    - serviceConnection: sreagentprod
    - serviceConnection: k8seprod      # used by session cli image

    stages:
    - stage: build_and_test
      dependsOn: []
      ${{ if parameters.isOfficialBuild }}:
        displayName: "🛠️ Build & Test Official"
      ${{ else }}:
        displayName: "🛠️ Build & Test NonOfficial"
      variables:
        #
        # Shared variables for all jobs in this stage
        #
        BuildSolution: .\src\Agent\Agent.sln
        BuildSolutionOutputPath: $(Build.SourcesDirectory)\sln_output
        BuildConfiguration: Release
        BuildNugetConfigPath: .\src\nuget.config
        ProjectSourcePath: '$(Build.SourcesDirectory)\src\Agent'
        ArtifactDirectory: '$(Build.SourcesDirectory)\out'
        ${{ if parameters.isOfficialBuild }}:
          ExtraBuildFlags: '/p:Version=$(Build.BuildNumber) /p:OfficialBuild=true'
        ${{ else }}:
          ExtraBuildFlags: ''

      jobs:
      - job: build
        displayName: "🔨 Build Agent"

        # Add NuGet publishing output when enabled
        ${{ if and(eq(parameters.isNugetPublish, true), eq(parameters.isOfficialBuild, true)) }}:
          templateContext:
            outputs:
            - output: nuget
              displayName: '📤 Publish Agent.Portal NuGet Package'
              useDotNetTask: false
              packagesToPush: '$(Build.ArtifactStagingDirectory)/packages/Microsoft.SREAgent.Portal.*.nupkg'
              packageParentPath: '$(Build.ArtifactStagingDirectory)/packages'
              publishVstsFeed: 'Antares/antares-websites'
              nuGetFeedType: internal
              allowPackageConflicts: false
              publishPackageMetadata: true

        steps:
        - checkout: self
          fetchDepth: 1
          persistCredentials: true # For localized file check-in

          # Used to get the packages that referenced by generated WorkerExtensions.csproj
        - task: NuGetAuthenticate@1
          displayName: NuGetAuthenticate

        # Collect Build information & make output directories just in case
        - task: PowerShell@2
          displayName: "ℹ️ Collect Build Information"
          continueOnError: true # This is not a required step, don't stop the build if it fails
          inputs:
            targetType: 'inline'
            workingDirectory: $(ProjectSourcePath)
            script: |
              echo "Build.BuildNumber is $(Build.BuildNumber)"
              echo "Build.Repository.Name is $(Build.Repository.Name)"
              echo "Build.SourcesDirectory is $(Build.SourcesDirectory)"
              echo "Build.BuildNumber is $(Build.BuildNumber)"
              echo "Build.BinariesDirectory is $(Build.BinariesDirectory)"

              echo "ArtifactDirectory is $(ArtifactDirectory)"

              echo "Contents of ProjectSourcePath $(ProjectSourcePath)"
              Get-ChildItem -Recurse  $(ProjectSourcePath) | Foreach-Object { $_.FullName }

        # Some of our tools create output directories as they go while some others require them to exist
        # before they can create their output. Let's make sure they are all there anyway
        - task: PowerShell@2
          displayName: '🔧 Prepare the build environment (make artifact output directories)'
          inputs:
            workingDirectory: $(Build.SourcesDirectory)
            targetType: 'inline'
            script: |
              New-Item $(ArtifactDirectory) -ItemType Directory -Force
              New-Item $(BuildSolutionOutputPath) -ItemType Directory -Force

        #
        # Just start the build process
        #
        - task: UseDotNet@2
          continueOnError: false
          displayName: '🧰 Setup .NET 9'
          inputs:
            version: 9.x
            packageType: 'sdk'

        #
        # Restore nuget packages
        #
        - task: DotNetCoreCLI@2
          displayName: '🔨 Restore Nuget packages'
          inputs:
            command: 'restore'
            projects: |
              $(BuildSolution)
            includeNuGetOrg: false
            feedsToUse: config
            nugetConfigPath: $(BuildNugetConfigPath)
            ## verbosityRestore: 'detailed'  # Use this to figure out whether the NuGet restore is hitting public internet.

        #
        # UX - Localization
        #
        - task: OneLocBuild@3
          displayName: '🔠 UX - Localization'
          continueOnError: true
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          inputs:
            # This also includes/handles the Agent.Portal client
            locProj: '$(Build.SourcesDirectory)\src\Agent\Agent.Web\Client\src\src\Strings\LocProject.json'
            outDir: '$(ArtifactDirectory)' # \loc
            packageSourceAuth: 'patAuth'
            dependencyPackageSource: 'https://msazure.pkgs.visualstudio.com/One/_packaging/OnelocbuildLocToolsFeed/nuget/v3/index.json'
            repoType: gitHub
            isCreatePrSelected: true
            isShouldReusePrSelected: true
            isAutoCompletePrSelected: false
            isSetAutoCompletePrSelected: true
            gitHubPrMergeMethod: squash
            prSourceBranchPrefix: 'locfiles'

        #
        # UX - Set node version for installing npm packages
        #
        - task: NodeTool@0
          inputs:
            versionSpec: "22.x"
            checkLatest: true

        #
        # UX - Authenticate NPM registry (this auth should cover Agent.Portal as well)
        #
        - task: npmAuthenticate@0
          displayName: 'UX - Auth'
          inputs:
            workingFile: '$(Build.SourcesDirectory)\src\Agent\Agent.Web\Client\.npmrc'

        #
        # UX - Agent.Web - Install NPM packages
        #
        - task: Npm@1
          displayName: 'UX - Agent.Web - Install NPM packages'
          inputs:
            command: 'install'
            workingDir: '$(Build.SourcesDirectory)\src\Agent\Agent.Web\Client'

        #
        # UX - Agent.Portal - Install NPM packages
        #
        - task: Npm@1
          displayName: 'UX - Agent.Portal - Install NPM packages'
          inputs:
            command: 'install'
            workingDir: '$(Build.SourcesDirectory)\src\Agent\Agent.Portal\Client'

        #
        # UX - Agent.Web - Build React app
        #
        - task: Npm@1
          displayName: 'UX - Agent.Web - Build React app'
          env:
            SRE_UX_VERSION: $(Build.BuildNumber)
          inputs:
            command: 'custom'
            customCommand: 'run build'
            workingDir: '$(Build.SourcesDirectory)\src\Agent\Agent.Web\Client'

        #
        # UX - Agent.Portal - Build React app
        #
        - task: Npm@1
          displayName: 'UX - Agent.Portal - Build React app'
          inputs:
            command: 'custom'
            customCommand: 'run build'
            workingDir: '$(Build.SourcesDirectory)\src\Agent\Agent.Portal\Client'
          env:
            SRE_AGENT_PORTAL_VERSION: $(Build.BuildNumber)

        #
        # Build Solution
        #
        - task: DotNetCoreCLI@2
          displayName: '🦾 Build Agent solution'
          env:
            SRE_UX_VERSION: $(Build.BuildNumber)
            SRE_AGENT_PORTAL_VERSION: $(Build.BuildNumber)
          inputs:
            command: build
            projects: '$(BuildSolution)'
            arguments: '--no-restore --output $(BuildSolutionOutputPath) -c $(BuildConfiguration) -p:Version=$(Build.BuildNumber) -p:SkipReactBuild=true'
            includeNuGetOrg: false

        - task: DotNetCoreCLI@2
          displayName: '🔨 Publish Agent.Web'
          env:
            SRE_UX_VERSION: $(Build.BuildNumber)
          inputs:
            command: 'publish'
            publishWebProjects: false
            projects: '.\src\Agent\Agent.Web\Agent.Web.csproj'
            arguments: '--no-restore --output $(ArtifactDirectory) -c $(BuildConfiguration) -p:Version=$(Build.BuildNumber) -p:SkipReactBuild=true'
            includeNuGetOrg: false
            zipAfterPublish: false

        - task: DotNetCoreCLI@2
          displayName: '🔨 Publish Session.Proxy'
          inputs:
            command: 'publish'
            publishWebProjects: false
            projects: '.\src\Agent\Session.Proxy\Session.Proxy.csproj'
            arguments: '--no-restore --output $(ArtifactDirectory) -c $(BuildConfiguration) -p:Version=$(Build.BuildNumber)'
            includeNuGetOrg: false
            zipAfterPublish: false

        - task: DotNetCoreCLI@2
          displayName: '🔨 Publish Session.Identity'
          inputs:
            command: 'publish'
            publishWebProjects: false
            projects: '.\src\Agent\Session.Identity\Session.Identity.csproj'
            arguments: '--no-restore --output $(ArtifactDirectory) -c $(BuildConfiguration) -p:Version=$(Build.BuildNumber)'
            includeNuGetOrg: false
            zipAfterPublish: false

        #
        # Build and Pack Agent.Portal NuGet Package
        # Only runs and packages when isNugetPublish and isOfficialBuild are both true
        # Publishing is done via templateContext outputs (see job-level templateContext above)
        #
        - ${{ if and(eq(parameters.isNugetPublish, true), eq(parameters.isOfficialBuild, true)) }}:
          - task: DotNetCoreCLI@2
            displayName: '📦 Build and Pack Agent.Portal NuGet Package'
            env:
              SRE_AGENT_PORTAL_VERSION: $(Build.BuildNumber)
            inputs:
              command: 'pack'
              packagesToPack: '.\src\Agent\Agent.Portal\Agent.Portal.csproj'
              configuration: '$(BuildConfiguration)'
              packDirectory: '$(Build.ArtifactStagingDirectory)\packages'
              versioningScheme: 'byBuildNumber'
              includeNuGetOrg: false
              nobuild: false
              arguments: '-p:SkipClientBuild=true'

        # keep roslynanalyzers task separate from dotnet build, otherwise compile-time LoggerMessage autogen partial classes will result in build error CS8795
        - task: RoslynAnalyzers@3
          displayName: '🔨 RoslynAnalyzers'
          inputs:
            copyLogsOnly: true

        # Sign the output binaries if it is an official build
        - ${{ if parameters.isOfficialBuild }}:
          - task: EsrpCodeSigning@5
            displayName: ESRP CodeSigning using WIF
            inputs:
              ConnectedServiceName: sreagent-esrp-signing
              AppRegistrationClientId: 91d22973-05c0-42c7-b99e-628a3cdce183
              AppRegistrationTenantId: 33e01921-4d64-4f8c-a055-5bdaffd5e33d
              AuthAKVName: sreagent-esrp-kv
              AuthCertName: esrp-authentication-certificate
              AuthSignCertName: esrp-request-signing-certificate
              FolderPath: $(ArtifactDirectory)
              Pattern: '*.dll'
              ServiceEndpointUrl: 'https://api.esrp.microsoft.com/api/v2'
              signConfigType: inlineSignParams
              inlineOperation: |
                [
                  {
                    "keyCode": "CP-230856",
                    "operationCode": "SigntoolSign",
                    "parameters": {
                      "OpusName": "Microsoft",
                      "OpusInfo": "http://www.microsoft.com",
                      "FileDigest": "/fd \"SHA256\"",
                      "PageHash": "/NPH",
                      "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                    },
                    "toolName": "sign",
                    "toolVersion": "1.0"
                  },
                  {
                    "keyCode": "CP-230856",
                    "operationCode": "SigntoolVerify",
                    "parameters": {},
                    "toolName": "sign",
                    "toolVersion": "1.0"
                  }
                ]

        # Publish the build artifacts
        - task: 1ES.PublishPipelineArtifact@1
          inputs:
            path: '$(ArtifactDirectory)'
            artifact: drop_build_main
          displayName: 'Publish Artifact'

        # - task: PowerShell@2
        #   displayName: 'Copy dockerfile to output directory'
        #   inputs:
        #     targetType: 'inline'
        #     script: |
        #       Copy-Item -Path $(Build.SourcesDirectory)\src\Deployment\Agent.Web\Dockerfile -Destination $(ob_outputDirectory)\src\Deployment\Agent.Web\Dockerfile

      - job: ux_test
        displayName: "🎨 UX Tests"
        steps:
        - checkout: self
          fetchDepth: 1
          persistCredentials: true # For localized file check-in

        #
        # UX - Set node version for installing npm packages
        #
        - task: NodeTool@0
          inputs:
            versionSpec: "22.x"
            checkLatest: true

        #
        # UX - Authenticate NPM registry (this auth should cover Agent.Portal as well)
        #
        - task: npmAuthenticate@0
          displayName: 'UX - Auth'
          inputs:
            workingFile: '$(Build.SourcesDirectory)\src\Agent\Agent.Web\Client\.npmrc'

        #
        # UX - Agent.Web - Install NPM packages
        #
        - task: Npm@1
          displayName: 'UX - Agent.Web - Install NPM packages'
          inputs:
            command: 'install'
            workingDir: '$(Build.SourcesDirectory)\src\Agent\Agent.Web\Client'

        #
        # UX - Agent.Portal - Install NPM packages
        #
        - task: Npm@1
          displayName: 'UX - Agent.Portal - Install NPM packages'
          inputs:
            command: 'install'
            workingDir: '$(Build.SourcesDirectory)\src\Agent\Agent.Portal\Client'

        #
        # UX - Agent.Web - Unit tests
        #
        - task: Npm@1
          displayName: '🧪 UX - Agent.Web - Unit tests'
          inputs:
              command: 'custom'
              workingDir: '$(Build.SourcesDirectory)\src\Agent\Agent.Web\Client'
              customCommand: 'run test'

        #
        # UX - Agent.Web - Publish unit test results
        #
        - task: PublishTestResults@2
          displayName: '📢 Publish UX - Agent.Web - Unit test results'
          inputs:
            testResultsFormat: JUnit
            testResultsFiles: '$(Build.SourcesDirectory)\src\Agent\Agent.Web\Client\junit-report.xml'
            failTaskOnFailedTests: true
            testRunTitle: 'UX_AgentWeb_UnitTests'

        #
        # UX - Agent.Portal - Unit tests
        #
        - task: Npm@1
          displayName: '🧪 UX - Agent.Portal - Unit tests'
          inputs:
              command: 'custom'
              workingDir: '$(Build.SourcesDirectory)\src\Agent\Agent.Portal\Client'
              customCommand: 'run test'

        #
        # UX - Agent.Portal - Publish unit test results
        #
        - task: PublishTestResults@2
          displayName: '📢 Publish UX - Agent.Portal - Unit test results'
          inputs:
            testResultsFormat: JUnit
            testResultsFiles: '$(Build.SourcesDirectory)\src\Agent\Agent.Portal\Client\junit-report.xml'
            failTaskOnFailedTests: true
            testRunTitle: 'UX_AgentPortal_UnitTests'

      - job: runtime_test
        displayName: "🧪 Runtime Tests"
        steps:
        - checkout: self
          fetchDepth: 1
          persistCredentials: true # For localized file check-in

          # Used to get the packages that referenced by generated WorkerExtensions.csproj
        - task: NuGetAuthenticate@1
          displayName: NuGetAuthenticate

        #
        # Just start the build process
        #
        - task: UseDotNet@2
          continueOnError: false
          displayName: '🧰 Setup .NET 9'
          inputs:
            version: 9.x
            packageType: 'sdk'

        #
        # Restore nuget packages
        #
        - task: DotNetCoreCLI@2
          displayName: '🔨 Restore Nuget packages'
          inputs:
            command: 'restore'
            projects: |
              $(BuildSolution)
            includeNuGetOrg: false
            feedsToUse: config
            nugetConfigPath: $(BuildNugetConfigPath)
            ## verbosityRestore: 'detailed'  # Use this to figure out whether the NuGet restore is hitting public internet.

        #
        # Build Solution
        #
        - task: DotNetCoreCLI@2
          displayName: '🦾 Build Agent solution'
          inputs:
            command: build
            projects: '$(BuildSolution)'
            arguments: '--no-restore --output $(BuildSolutionOutputPath) -c $(BuildConfiguration) -p:Version=$(Build.BuildNumber) -p:SkipReactBuild=true'
            includeNuGetOrg: false

        # Run unit tests
        - task: DotNetCoreCLI@2
          displayName: '🧪 Run unit tests'
          inputs:
            command: 'test'
            projects: '$(BuildSolution)'
            arguments: '--no-build --output $(BuildSolutionOutputPath) -c $(BuildConfiguration) --blame --logger trx --collect "Code coverage" --results-directory $(Build.SourcesDirectory)\TestResults\ --filter FullyQualifiedName~Agent.Tests.Unit'
            publishTestResults: false

        #
        # Run integration tests
        #
        - task: DotNetCoreCLI@2
          displayName: '🧪 Run integration tests'
          inputs:
            command: 'test'
            projects: '$(BuildSolution)'
            arguments: '--no-build --output $(BuildSolutionOutputPath) -c $(BuildConfiguration) --blame --logger trx --collect "Code coverage" --results-directory $(Build.SourcesDirectory)\TestResults\ --filter FullyQualifiedName\!~Agent.Tests'
            publishTestResults: false

        #
        # Run Agent.Cli.UnitTests
        #
        - task: DotNetCoreCLI@2
          displayName: '🧪 Run Agent.Cli.UnitTests'
          inputs:
            command: 'test'
            projects: 'src/Agent/Agent.Cli.UnitTests/Validations/'
            arguments: '--no-build --output $(BuildSolutionOutputPath) -c $(BuildConfiguration) --blame --logger trx --collect "Code coverage" --results-directory $(Build.SourcesDirectory)\ValidationTestResults\'
            publishTestResults: false

        #
        # Publish Agent.Cli.UnitTests results
        #
        - task: PublishTestResults@2
          displayName: '📢 Publish Agent.Cli.UnitTests results'
          inputs:
            testResultsFormat: VSTest
            testResultsFiles: '$(Build.SourcesDirectory)\ValidationTestResults\*.trx'
            failTaskOnFailedTests: true
            testRunTitle: 'ValidationTests'

        #
        # Publish Integration Test results
        #
        - task: PublishTestResults@2
          displayName: '📢 Publish test results'
          inputs:
            testResultsFormat: VSTest
            testResultsFiles: '$(Build.SourcesDirectory)\TestResults\*.trx'
            failTaskOnFailedTests: true

    - ${{ if parameters.isOfficialBuild }}:
      - stage: docker_agent_web
        dependsOn:
        - build_and_test
        jobs:
        - job: image_build
          displayName: "🔨 Build Docker Image for Agent.Web"
          pool:
            name: 1ES-SREAgent-Build
            image: 1ESPT-Vanilla-Ubuntu-2204
            os: linux
          steps:
            # This task downloads the build artifacts from the previous stage.
          - task: DownloadPipelineArtifact@2
            inputs:
              targetPath: $(Build.SourcesDirectory)/dst/drop_build_main
              artifact: drop_build_main
              patterns: 'Agent.Web/**'

          - task: Bash@3
            displayName: '📊 Check disk space before Agent.Web image build'
            inputs:
              targetType: 'inline'
              script: |
                echo "=== Check Disk Space ==="
                df -h
                echo "=========================================="

          - task: 1ES.BuildContainerImage@1
            displayName: 'Build Docker image for Agent.Web'
            inputs:
              context: $(Build.SourcesDirectory)/dst/drop_build_main/Agent.Web
              dockerFile: $(Build.SourcesDirectory)/src/Deployment/Agent.Web/Dockerfile
              image: sre-agent-web:$(Build.BuildNumber)
              enableNetwork: true

          templateContext:
            outputs:
            - output: containerImage
              image: sre-agent-web:$(Build.BuildNumber)
              # Commented out remote image push
              remoteImage:
              - sreagentdev.azurecr.io/sre-agent-web:$(Build.BuildNumber)
              - sreagentprod.azurecr.io/sre-agent-web:$(Build.BuildNumber)

      - stage: docker_session_proxy
        dependsOn:
        - build_and_test
        jobs:
        - job: image_build
          displayName: "🔨 Build Docker Image for Session.Proxy"
          pool:
            name: 1ES-SREAgent-Build
            image: 1ESPT-Vanilla-Ubuntu-2204
            os: linux
          steps:
            # This task downloads the build artifacts from the previous stage.
          - task: DownloadPipelineArtifact@2
            inputs:
              targetPath: $(Build.SourcesDirectory)/dst/drop_build_main
              artifact: drop_build_main
              patterns: 'Session.Proxy/**'

          - task: Bash@3
            displayName: '📊 Check disk space before Session.Proxy image build'
            inputs:
              targetType: 'inline'
              script: |
                echo "=== Check Disk Space ==="
                df -h
                echo "=========================================="

          - task: 1ES.BuildContainerImage@1
            displayName: 'Build Docker image for Session.Proxy'
            inputs:
              context: $(Build.SourcesDirectory)/dst/drop_build_main/Session.Proxy
              dockerFile: $(Build.SourcesDirectory)/src/Deployment/Session.Proxy/Dockerfile
              image: session-proxy:$(Build.BuildNumber)
              enableNetwork: true

          templateContext:
            outputs:
            - output: containerImage
              image: session-proxy:$(Build.BuildNumber)
              # Commented out remote image push
              remoteImage:
              - k8seprod.azurecr.io/public/k8se/sreagent/session-proxy:$(Build.BuildNumber)

      - stage: docker_session_identity
        dependsOn:
        - build_and_test
        jobs:
        - job: image_build
          displayName: "🔨 Build Docker Image for Session.Identity"
          pool:
            name: 1ES-SREAgent-Build
            image: 1ESPT-Vanilla-Ubuntu-2204
            os: linux
          steps:
            # This task downloads the build artifacts from the previous stage.
          - task: DownloadPipelineArtifact@2
            inputs:
              targetPath: $(Build.SourcesDirectory)/dst/drop_build_main
              artifact: drop_build_main
              patterns: 'Session.Identity/**'

          - task: 1ES.BuildContainerImage@1
            displayName: 'Build Docker image for Session.Identity'
            inputs:
              context: $(Build.SourcesDirectory)/dst/drop_build_main/Session.Identity
              dockerFile: $(Build.SourcesDirectory)/src/Deployment/Session.Identity/Dockerfile
              image: session-identity:$(Build.BuildNumber)
              enableNetwork: true

          templateContext:
            outputs:
            - output: containerImage
              image: session-identity:$(Build.BuildNumber)
              # Commented out remote image push
              remoteImage:
              - k8seprod.azurecr.io/public/k8se/sreagent/session-identity:$(Build.BuildNumber)
