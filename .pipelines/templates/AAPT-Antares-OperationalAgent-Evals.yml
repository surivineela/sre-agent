parameters:
- name: category
  type: string
- name: targetApiVersion
  type: string
  default: '*'
- name: displayName
  type: string
- name: singleTestTimeout
  type: string
  default: 30m
- name: timeoutMinutes
  type: number
  default: 30

steps:
- script: echo Integration Test Pipeline Run $(Build.BuildNumber)!
  displayName: 'Starting integration test run for ${{ parameters.displayName }}'

- task: UseDotNet@2
  continueOnError: false
  displayName: '🧰 Setup .NET 9'
  inputs:
    version: 9.x
    packageType: 'sdk'

- task: NuGetAuthenticate@1
  inputs:
    forceReinstallCredentialProvider: false # Optional

# Restore nuget
- script: dotnet restore src/Agent/Agent.Evals/Agent.Evals.csproj
  env:
    NUGET_PLUGIN_HANDSHAKE_TIMEOUT_IN_SECONDS: 60
    NUGET_PLUGIN_REQUEST_TIMEOUT_IN_SECONDS: 60

  displayName: 'Restore nuget for ${{ parameters.displayName }}'

- task: AzureKeyVault@2
  inputs:
    azureSubscription: 'SRE_AGENT_TESTING_SERVICE_CONNECTION'
    KeyVaultName: 'sre-agent-keyvault'
    SecretsFilter: '*'
    RunAsPreJob: false

# Execute the test
- script: dotnet test src/Agent/Agent.Evals/Agent.Evals.csproj --no-restore --logger trx --results-directory $(Build.SourcesDirectory)\TestResults\
  env:
    OpenAIEndpoint: $(SRE_AGENT_OPENAI_ENDPOINT)
    OpenAIKey: $(EvalsOpenAIKey)
    OpenAIModel: $(SRE_AGENT_OPENAI_MODEL)
    IterationCount: 5
  timeoutInMinutes: ${{ parameters.timeoutMinutes }}
  displayName: 'Running evals for ${{ parameters.displayName }}'

- task: PublishTestResults@2
  condition: always()
  inputs:
    testRunner: VSTest
    testResultsFiles: '$(Build.SourcesDirectory)\TestResults\**\*.trx'

# Publish test result to event hub
- script: dotnet run --project src/Agent/Agent.Evals.Cmd/Agent.Evals.Cmd.csproj
  condition: always()
  env:
    SRE_AGENT_TESTING_TEST_RESULTS_LOCATION: '$(Build.SourcesDirectory)\TestResults\'
    SRE_AGENT_EVENT_HUB_CONNECTION_STRING: $(TestResultEventHubConnectionStr)
  timeoutInMinutes: ${{ parameters.timeoutMinutes }}

  displayName: 'Uploading evals tests results to event hub for ${{ parameters.displayName }}'
