#################################################################################
#                              Shared Build Pipeline                            #
#                                                                               #
#                               OneBranch Pipelines                             #
# Documentation:  https://aka.ms/onebranchrelease                               #
# Yaml Schema:    https://aka.ms/obpipelines/yaml/schema                        #
# Support:        https://aka.ms/onebranchsupport                               #
#################################################################################

# Please uncomment and provide values for the placeholdes in the << >> notation:
# 1. The "dependsOn" in the download stage of the test stage example (if applicable)
# 2. The "ServiceRootPath" and "RolloutSpecPath" in each of the test stage example

parameters:
- name: 'isOfficialBuild'
  displayName: 'Enables or Disables an Official build and its configuration (signing and other build steps'
  type: boolean
  default: false

resources:
  repositories:
  - repository: templates
    type: git
    name: OneBranch.Pipelines/GovernedTemplates
    ref: refs/heads/main

# To learn about the best release strategy for your team, please visit https://aka.ms/ev2/pipeline/strategy
extends:
  ${{ if parameters.isOfficialBuild }}:
    template: v2/OneBranch.Official.CrossPlat.yml@templates  # https://aka.ms/obpipelines/templates
  ${{ else }}:
    template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates  # https://aka.ms/obpipelines/templates
  parameters:
    # We enable CloudVault for Official builds but as a separate stage.
    # This limits CloudVault upload to the contents of the very last stage, in which we pack everything for Ev2.
    # This also side-steps the whole "No CloudVault on linux" issue.
    # https://eng.ms/docs/products/onebranch/artifactsandsymbols/containerbasedbuildworkflows/cloudvaultupload
    ${{ if parameters.isOfficialBuild }}:
      cloudvault: # https://aka.ms/obpipelines/cloudvault
        enabled: true
        runmode: stage
        dependsOn:  # list of stages to run before cloudvault uploads
        - build
        artifacts: # list of artifacts to upload to CloudVault
        - drop_build_main
    # There is no point in enabling cloudvault and others for NonOfficial builds
    ${{ else }}:
      cloudvault:
        enabled: false
    globalSdl: # https://aka.ms/obpipelines/sdl
      # Only enable CodeQL and TSA for Official builds
      ${{ if parameters.isOfficialBuild }}:
        codeql:
          compiled:
            enabled: true
        tsa:
          enabled: true # onebranch publish all sdl results to TSA. If TSA is disabled all SDL tools will forced into 'break' build mode.
      # ${{ else }}:
      #   nothing really to do here for NonOfficial builds
      # credscan:
      #   suppressionsFile: $(Build.SourcesDirectory)\.config\CredScanSuppressions.json
      policheck:
        break: true # always break the build on policheck issues. You can disable it by setting to 'false'
      # suppression:
      #   suppressionFile: $(Build.SourcesDirectory)\.gdn\global.gdnsuppress

    git:
      longpaths: true
      submodules: false
      fetchTags: false
      fetchDepth: 1
    featureFlags:
      # Netlock: opt-in into network isolation https://eng.ms/docs/cloud-ai-platform/azure-edge-platform-aep/aep-engineering-systems/productivity-and-experiences/ce-legacy-infrastructure/onebranch/infrastructureandimages/buildinfrastructureandimages/networkisolation#manual-opt-in-to-policies
      LinuxHostVersion:
        Network: Netlock
      WindowsHostVersion:
        Network: Netlock
        Version: 2022

    stages:
    - stage: build
      ${{ if parameters.isOfficialBuild }}:
        displayName: "🛠️ Build Official"
      ${{ else }}:
        displayName: "🛠️ Build NonOfficial"
      jobs:
      - job: main # Super std name for main build step in this stage
        displayName: "🔨 Build Agent"
        pool:
          # read more about custom job pool types at https://aka.ms/obpipelines/yaml/jobs
          type: windows # RosynAnalyzers are not supported on Linux yet
        variables:
          #
          # Constants (because there is no better way to do it in YAML)
          #
          BuildSolution: .\src\Agent\Agent.sln
          BuildConfiguration: Release
          BuildNugetConfigPath: .\src\nuget.config

          #
          # OneBranch variables
          #
          ob_sdl_binskim_enabled: true # you can disable sdl tools in non-official build.
          ob_sdl_binskim_break: true # always break the build on binskim issues. You can disable it by setting to 'false'
          ob_sdl_binskim_scanOutputDirectoryOnly: ${{ not(parameters.isOfficialBuild) }} # Scan everything if it is an offical build
          ob_sdl_roslyn_break: true
          ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}: # conditionally enable symbolsPublishing for main branch only
            ob_symbolsPublishing_enabled: true # https://aka.ms/obpipelines/symbols
          # Input and source location-related variables
          #
          projectSrcPath: '$(Build.SourcesDirectory)\src\Agent'
          #
          # Build flags
          #
          ${{ if parameters.isOfficialBuild }}:
            extraBuildFlags: '/p:Version=$(Build.BuildNumber) /p:OfficialBuild=true'
          ${{ else }}:
            extraBuildFlags: ''
          #
          # Artifact and build output location-related variables
          #
          # this directory is uploaded to pipeline artifacts, reddog and cloudvault. More info at https://aka.ms/obpipelines/artifacts
          ob_outputDirectory: '$(Build.SourcesDirectory)\out'

        steps:
        # generates automatic version. For other versioning options check https://aka.ms/obpipelines/versioning
        - task: onebranch.pipeline.version@1
          displayName: 'Setup Build Version Number'
          inputs:
            system: 'RevisionCounter'
            major: '0'
            minor: '1'
            exclude_commit: true

        # Collect Build info & make output directories just in case
        - task: PowerShell@2
          displayName: "ℹ️ Collect build info"
          continueOnError: true # This is not a required step, don't stop the build if it fails
          inputs:
            targetType: 'inline'
            workingDirectory: $(projectSrcPath)
            script: |
              echo "Build.BuildNumber is $(Build.BuildNumber)"
              echo "Build.Repository.Name is $(Build.Repository.Name)"
              echo "Build.SourcesDirectory is $(Build.SourcesDirectory)"
              echo "Build.BuildNumber is $(Build.BuildNumber)"
              echo "Build.BinariesDirectory is $(Build.BinariesDirectory)"              

              echo "ob_outputDirectory is $(ob_outputDirectory)"
            
              echo "Contents of projectSrcPath $(projectSrcPath)"
              Get-ChildItem -Recurse  $(projectSrcPath) | Foreach-Object { $_.FullName }
        # Some of our tools create output directores as they go while some others require them to exist
        # before they can create their ouput. Let's make sure they are all there anyway
        - task: PowerShell@2
          displayName: '🔧 Prepare the build environment (make artifact output directories)'
          inputs:
            workingDirectory: $(Build.SourcesDirectory)
            targetType: 'inline'
            script: |
              New-Item $(ob_outputDirectory) -ItemType Directory -Force
        
        #
        # Just start the build process
        #
        - task: UseDotNet@2
          continueOnError: false
          displayName: '🧰 Setup .NET 9'
          inputs:
            version: 9.x
            packageType: 'sdk'

        #
        # Restore nuget packages
        #
        - task: DotNetCoreCLI@2
          displayName: '🔨 Restore Nuget packages'
          inputs:
            command: 'restore'
            projects: |
              $(BuildSolution)
            includeNuGetOrg: false
            feedsToUse: config
            nugetConfigPath: $(BuildNugetConfigPath)
            ## verbosityRestore: 'detailed'  # Use this to figure out whether the NuGet restore is hitting public internet.

        #
        # Build Solution
        #
        - task: DotNetCoreCLI@2
          displayName: '🦾 Build Agent solution'
          inputs:
            command: build
            projects: '$(BuildSolution)'
            arguments: '--no-restore --output $(ob_outputDirectory) -c $(BuildConfiguration) -p:Version=$(Build.BuildNumber)'
            includeNuGetOrg: false

        - task: DotNetCoreCLI@2
          displayName: '🔨 Publish Agent.Web'
          inputs:
            command: 'publish'
            publishWebProjects: false
            projects: |
              **/*/Agent.Web.csproj
            arguments: '--no-restore --output $(ob_outputDirectory)/Agent.Web -c $(BuildConfiguration) -p:Version=$(Build.BuildNumber)'
            includeNuGetOrg: false

            

        # Add runtime test for Agent.Web
        # Commenting this out for now, since running this project depends on settings being present
        # (We want to know if something is broken before runtime)
        # We can re-enable this once we set up some infra or mock this for pipelines
        #
        # - task: PowerShell@2
        #   displayName: '🧪 Runtime test Agent.Web'
        #   inputs:
        #     targetType: 'inline'
        #     workingDirectory: $(Build.SourcesDirectory)
        #     script: |
        #         $process = Start-Process -FilePath "dotnet" -ArgumentList "run --project ./src/Agent/Agent.Web/Agent.Web.csproj --session" -RedirectStandardOutput "runtime.log" -RedirectStandardError "error.log" -PassThru
        #         Write-Host "Started Agent.Web with PID: $($process.Id)"
        #         Start-Sleep -Seconds 30
        #         if (!$process.HasExited) {
        #           Write-Host "Agent.Web ran successfully for 30 seconds, stopping process..."
        #           Stop-Process -Id $process.Id -Force
        #           exit 0
        #         } else {
        #           Write-Host "Agent.Web crashed or exited prematurely"
        #           Write-Host "Error logs:"
        #           Get-Content "error.log"
        #           exit 1
        #         }

        # keep roslynanalyzers task separate from dotnet build, otherwise compile-time LoggerMessage autogen partial classes will result in build error CS8795
        - task: RoslynAnalyzers@3
          displayName: '🔨 RoslynAnalyzers'
          inputs:
            copyLogsOnly: true

        #
        # Run integration tests
        #
        - task: DotNetCoreCLI@2
          displayName: '🧪 Run integration tests'
          inputs:
            command: 'test'
            projects: '$(BuildSolution)'
            arguments: '--no-build --output $(ob_outputDirectory) -c $(BuildConfiguration) --blame --logger trx --collect "Code coverage" --results-directory $(Build.SourcesDirectory)\TestResults\ --filter FullyQualifiedName\!~Agent.Tests' 
            publishTestResults: false

        #
        # Publish Integration Test results
        #
        - task: PublishTestResults@2
          displayName: '📢 Publish test results'
          inputs:
            testResultsFormat: VSTest
            testResultsFiles: '$(Build.SourcesDirectory)\TestResults\**\*.trx'
            failTaskOnFailedTests: true

        # - task: PowerShell@2
        #   displayName: 'Copy dockerfile to output directory'
        #   inputs:
        #     targetType: 'inline'
        #     script: |
        #       Copy-Item -Path $(Build.SourcesDirectory)\src\Deployment\Agent.Web\Dockerfile -Destination $(ob_outputDirectory)\src\Deployment\Agent.Web\Dockerfile

        #
        # Sign output binaries if it is an official build
        #
        - ${{ if parameters.isOfficialBuild }}:
          - task: onebranch.pipeline.signing@1
            displayName: '✒️ Sign output binaries'
            inputs:
              command: 'sign'
              signing_profile: 'internal_azure_service'
              files_to_sign: '**/*.exe;**/*.dll;**/*.ps1'
              search_root: '$(ob_outputDirectory)'

    - ${{ if parameters.isOfficialBuild }}:
      - stage: docker      
        dependsOn: build
        jobs:
        - job: buildImageForAgentWeb
          displayName: "🔨 Build Docker Image for Agent.Web"
          pool:
            type: docker
            os: linux
          variables:
            ob_git_checkout: true
          steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              targetPath: $(Build.SourcesDirectory)/dst/drop_build_main
              artifact: drop_build_main
            # This task downloads the build artifacts from the previous stage.

          - task: onebranch.pipeline.containercontrol@1
            displayName: "Login to ACR"
            inputs:
              command: login
              acr_name: k8seprod
              endpoint: k8seprod

          - task: onebranch.pipeline.imagebuildinfo@1
            displayName: 'Build Docker image for Agent.Web'
            inputs:
              registry: k8seprod.azurecr.io
              repositoryName: public/k8se/sre-agent-web
              dockerFileRelPath: src/Deployment/Agent.Web/Dockerfile
              dockerFileContextPath: drop_build_main/Agent.Web
              saveImageToPath: 'images/sre-agent-web.tar.gz'
              saveMetadataToPath: 'images/sre-agent-web-metadata.json'
              enable_service_tree_acr_path: false
              build_tag: $(Build.BuildNumber)
              enable_acr_push: true
              endpoint: k8seprod
